.stage{flex:none;height:clamp(210px,36dvh,300px);border:1px solid var(--line);border-radius:14px;background:#0D1119;overflow:hidden;display:grid;place-items:center}

.cap{flex:1;min-height:0;overflow-y:auto;padding:14px 2px 6px}
.cap h1{color:var(--ink);font-size:22px;line-height:1.2;margin:0 0 6px}
.cap p.intro{font-size:15px;line-height:1.45;margin:0 0 12px}.cap p.intro b{color:var(--ink)}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4;animation:fin .35s ease}
.rows li .tag{flex:none;min-width:92px;height:20px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font:600 10px var(--body);letter-spacing:.06em}

.bar{flex:none;display:flex;gap:8px;padding-top:10px}

.bar .nav{width:52px;font-size:20px}.bar .nav:disabled{opacity:.3}
.bar .act{flex:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
@keyframes fin{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.cover{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px}

const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function attackScene(k,after){ let s=DEFS+box(14,100,96,60,'agent','run_code',{fill:'#1D1630',stroke:VIO,fs:13})+`<text x="14" y="22" fill="${after?GRN:RED}" font-size="11" font-weight="700" letter-spacing="1.4">${after?'AFTER':'BEFORE'} · POISONED TASK</text>`;

    s+=box(196,y-15,150,30,t,'',{op:on?1:.35,stroke:on&&r.ok?'#6B2C32':EDGE,ink:on&&r.ok?'#F08A8D':on?'#7C879B':'#7C879B',fs:10.5});
    if(on&&r.ok) s+=arrow(110,130,194,y,RED);
    if(on&&!r.ok){ const yy=130+(y-130)*.55; s+=arrow(110,130,148,yy,DIM,1)+xm(156,yy)+`<text x="168" y="${yy-9}" fill="${GRN}" font-size="8.5" font-weight="600">stage ${st}</text>`; } });

const S=[
 { ch:'1 · The cluster before', t:'An agent, wide open.',
   p:`The agent takes tasks from a queue, calls a model outside the cluster, and runs the tools named in its MCP config - one of them runs code. <b>No policy selects it.</b>`,

     D.tools.filter(t=>t.kind==='remote').forEach((t,i)=>{ s+=box(110+i*48,200,44,30,t.name,'',{fs:9.5})+arrow(180,155,132+i*48,198,BLU); });
     s+=box(262,30,88,40,'the model','',{})+arrow(240,110,262,55,BLU)+box(262,190,88,40,'anything','internet · K8s API',{stroke:'#6B2C32'})+arrow(240,140,262,205,RED); return s; } },
 { ch:'1 · The cluster before', t:'An attacker poisons a task.',

   svg:k=>attackScene(k,false),
   take:k=>k>=ATT.length?'5 of 5 worked. <span>The token, the API, other namespaces, a root shell, data out.</span>':'' },
 { ch:'2 · Collect', t:'Read what is written. Watch what happens.',
   p:'No new agent in the cluster. The product reads the configuration the team already wrote, and uses the engines already running - Hubble and Tetragon - to watch.',
   n:D.sources.length, act:k=>k<D.sources.length?`Read ${D.sources[k].name}`:'',
   rows:k=>D.sources.slice(0,k).map(x=>({c:x.kind==='observed'?'vio':'info',k:x.kind==='observed'?'WATCHED':'CONFIG',t:`<b>${esc(x.name)}</b>`,s:esc(x.what)})),
   svg:k=>{ let s=DEFS+box(220,105,128,52,'agent profile','4 layers',{fill:'#0F1F17',stroke:k>=D.sources.length?GRN:EDGE,fs:13});
     D.sources.forEach((x,i)=>{ const y=16+i*40, on=i<k; s+=box(10,y,150,30,esc(x.name.replace(' (mcp.json)','').replace('Tetragon - ','Tetragon: ')),'',{op:on?1:.3,stroke:on?(x.kind==='observed'?VIO:BLU):EDGE,fs:9.5}); if(on) s+=arrow(160,y+15,218,131,x.kind==='observed'?VIO:BLU); }); return s; },
   take:k=>k>=D.sources.length?'Six sources, one profile. <span>Every row keeps its evidence.</span>':'' },
 { ch:'2 · Build the profile', t:'One profile, four layers.',
   p:'Each row crosses two questions: <b>is it needed</b> (from the configuration) and <b>was it seen</b> (from watching).',
   n:4, act:k=>['Network','Programs','Files','Kernel calls'][k]?`Show ${['network','programs','files','kernel calls'][k]}`:'',
   rows:k=>['network','programs','files','kernel'].slice(0,k).map(l=>{ const rs=D.profile.filter(r=>r.layer===l), c=rs.reduce((a,r)=>(a[r.view]=(a[r.view]||0)+1,a),{});
     return {c:'info',k:l.toUpperCase(),t:`<b>${rs.length} rows</b> · ${Object.entries(c).map(([v,n])=>`${n} ${v.toLowerCase()}`).join(' · ')}`,s:`<span class="mono">${rs.slice(0,4).map(r=>esc(r.what.replace(/^agent:/,''))).join('  ·  ')}${rs.length>4?'  …':''}</span>`}; }),
   svg:k=>{ const L=['network','programs','files','kernel'], COL={OPEN:GRN,ASK:'#E8A33D',SUSPECT:'#F08A8D',CLOSE:DIM}; let s='';
     L.forEach((l,i)=>{ const x=8+i*88, on=i<k, rs=D.profile.filter(r=>r.layer===l);
       s+=`<g opacity="${on?1:.3}"><rect x="${x}" y="12" width="82" height="236" rx="10" fill="#0F141E" stroke="${EDGE}"/><text x="${x+41}" y="32" text-anchor="middle" fill="#E9EDF5" font-size="11" font-weight="600">${l}</text>`;
       rs.slice(0,24).forEach((r,j)=>{ s+=`<rect x="${x+8+(j%3)*23}" y="${44+Math.floor(j/3)*24}" width="19" height="17" rx="4" fill="${COL[r.view]}" opacity=".85"><title>${esc(r.what)} - ${esc(r.state)}</title></rect>`; }); s+='</g>'; });
     return s; },
   take:k=>k>=4?'Green open · amber ask · red suspect · grey close. <span>Built from the run, not typed.</span>':'' },
 { ch:'3 · Decide', t:'Needed stays. Seen is not trusted.',
   p:'The product decides from the evidence. A person decides what is unclear.',
   n:4, act:k=>['What stays','What is suspect','What closes','What a person decides'][k]||'',
   rows:k=>{ const oai=D.profile.find(r=>/api.openai/.test(r.what)), tok=D.profile.find(r=>/serviceaccount/.test(r.what)), sus=D.profile.filter(r=>r.view==='SUSPECT'), ask=D.profile.filter(r=>r.view==='ASK'), cl=D.profile.filter(r=>r.view==='CLOSE');
     return [{c:'ok',k:'OPEN',t:`<b>${esc(oai&&oai.what)}</b> - needed and seen.`,s:esc(oai&&oai.why)},
      {c:'bad',k:'SUSPECT',t:`<b>${sus.length} rows seen that nothing needs</b> - among them the token.`,s:`<span class="mono">${sus.map(r=>esc(r.what)).slice(0,4).join(' · ')}</span>`},
      {c:'dim',k:'CLOSE',t:`<b>Nothing needs it:</b> the internet beyond the model, the K8s API, other namespaces, every other program, ${cl.length} risky kernel calls.`},
      {c:'warn',k:'ASK',t:`<b>${ask.length} needed, not seen yet</b> - kept open, never closed by guess.`,s:'And one question answered by a person: the agent’s code ConfigMap holds no address of its own.'}].slice(0,k); },
   svg:k=>{ const C=[[GRN,'OPEN'],['#F08A8D','SUSPECT'],[DIM,'CLOSE'],['#E8A33D','ASK']]; let s='';
     C.forEach(([c,t],i)=>{ const on=i<k, n=D.profile.filter(r=>r.view===t).length; s+=`<g opacity="${on?1:.3}"><rect x="${20+(i%2)*170}" y="${20+Math.floor(i/2)*118}" width="150" height="104" rx="12" fill="#0F141E" stroke="${c}"/><text x="${95+(i%2)*170}" y="${66+Math.floor(i/2)*118}" text-anchor="middle" fill="${c}" font-size="30" font-weight="700">${n}</text><text x="${95+(i%2)*170}" y="${92+Math.floor(i/2)*118}" text-anchor="middle" fill="#B4BDCD" font-size="11" font-weight="600" letter-spacing="1.2">${t}</text></g>`; });
     return s; },

   n:D.stages.length, act:k=>k<D.stages.length?`Stage ${D.stages[k].k}`:'',
   rows:k=>D.stages.slice(0,k).map(s=>({c:'ok',k:`STAGE ${s.k}`,t:`<b>${esc(s.name)}</b> - closes ${esc(s.closes)}.`,s:`${esc(s.engine)} · rehearsal ${s.proof.verdict==='PASS'?'✓':'✗'} · replay ${s.proof.verdict==='PASS'?'✓':'✗'} · watching ${s.watching?'✓':'✗'} · enforced`})),
   svg:k=>{ let s=''; const P=['rehearsal','replay','watching','enforced'];
     D.stages.forEach((st,i)=>{ const y=14+i*60, on=i<k; s+=`<g opacity="${on?1:.3}"><rect x="8" y="${y}" width="344" height="50" rx="10" fill="#0F141E" stroke="${on?'#2B6B48':EDGE}"/><rect x="18" y="${y+12}" width="26" height="26" rx="7" fill="${on?GRN:EDGE}"/><text x="31" y="${y+30}" text-anchor="middle" fill="#0A0D14" font-size="13" font-weight="700">${st.k}</text><text x="52" y="${y+21}" fill="#E9EDF5" font-size="9.5" font-weight="600">${esc(st.name)}</text><text x="52" y="${y+37}" fill="#7C879B" font-size="9">${esc(st.engine)}</text>`;
       P.forEach((p,j)=>{ const ok=j<2?st.proof.verdict==='PASS':j===2?st.watching:true; s+=`<rect x="${200+j*38}" y="${y+26}" width="35" height="17" rx="5" fill="${ok?'#0F1F17':'#22151A'}" stroke="${ok?'#1E4632':'#6B2C32'}"/><text x="${217.5+j*38}" y="${y+37.5}" text-anchor="middle" fill="${ok?GRN:'#F08A8D'}" font-size="7">${p}</text>`; }); s+='</g>'; });

 { ch:'5 · The same attack, after', t:'Same poisoned task. Same code.',

   svg:k=>attackScene(k,true),

 { ch:'Summary', t:'From open to least privilege, on a real cluster.',

     {c:'info',k:'RUN',t:`Lab run ${(D.attack.when||'').replace(/(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)/,'$1-$2-$3 $4:$5')} UTC`,s:'k3s on two nodes · Cilium 1.20 · Tetragon · <a href="./">back to the tour</a>'}],
   svg:()=>attackScene(ATT.length,true) }];
let at=0, k=0;
function render(){ const s=S[at];
  $('prog').innerHTML=S.map((_,i)=>`<i class="${i<at?'d':i===at?'n':''}"></i>`).join('');
  $('chap').innerHTML=`<span>${esc(s.ch)}</span><em>${at+1} / ${S.length}</em>`;
  $('map').innerHTML=s.svg(k);
  const rows=s.rows(k)||[];
  $('cap').innerHTML=`<h1>${s.t}</h1><p class="intro">${s.p}</p>${rows.length?`<ul class="rows">${rows.map(r=>`<li class="c-${r.c}"><span class="tag">${r.k}</span><span>${r.t}${r.s?`<small>${r.s}</small>`:''}</span></li>`).join('')}</ul>`:''}${s.take&&s.take(k)?`<p class="take">${s.take(k)}</p>`:''}`;
  $('cap').scrollTop=$('cap').scrollHeight;
  const done=k>=s.n; $('act').textContent=done?(at<S.length-1?`Next: ${S[at+1].ch.replace(/^\d · /,'')} ›`:s.act(k)):s.act(k);

$('act').onclick=()=>{ const s=S[at]; if(k<s.n){ k++; } else if(at<S.length-1){ at++; k=0; } else { at=0; k=0; $('cover').hidden=false; } render(); };
$('next').onclick=()=>{ if(at<S.length-1){ at++; k=0; render(); } };
$('back').onclick=()=>{ if(k>0) k--; else if(at>0){ at--; k=S[at].n; } render(); };
$('start').onclick=()=>{ $('cover').hidden=true; at=0; k=0; render(); };
document.addEventListener('keydown',e=>{ if($('cover').hidden&&(e.key==='ArrowRight'||e.key===' ')){ e.preventDefault(); $('act').click(); } if(e.key==='ArrowLeft') $('back').click(); });
