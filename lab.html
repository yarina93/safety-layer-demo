.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}

.body{flex:1;overflow-y:auto;padding:18px 32px 40px}

 {k:'Your call', t:'Your call', p:()=>{ const tok=D.profile.find(r=>/serviceaccount/.test(r.what)), ask=D.profile.find(r=>r.view==='ASK');
     return `Most of the profile is decided for you. <b>${Q.length} rows</b> need a person - here are two:
     <div class="q"><b>Close it?</b> <span class="mono">${esc(tok&&tok.what)}</span><span class="ev">It was opened during the recording, but nothing in the configuration needs it. (It was the attacker.)</span></div>
     <div class="q"><b>Keep it open?</b> <span class="mono">${esc(ask&&ask.what)}</span><span class="ev">The configuration needs it, it just wasn’t seen yet. We never close a need by guessing.</span></div>`; }, pic:picDecide,
   go:()=>S.ok?'Next':'Accept the recommendations', act:async()=>{ S.ok=true; log('warn',`Decisions: ${D.profile.filter(r=>r.view==='SUSPECT').length} closed, ${D.profile.filter(r=>r.view==='ASK').length} kept open`); draw(); }, done:()=>S.ok,
   res:()=>S.ok?`<div class="result ok"><b>Recommendations accepted.</b> Used-but-not-needed rows close; needed-not-seen rows stay open.</div>`:'',
   more:()=>`<table class="tbl"><tr><th>Row</th><th>Recommendation</th></tr>${Q.map(r=>`<tr><td class="mono">${esc(r.what)}</td><td>${r.view==='SUSPECT'?'close':'keep open'}</td></tr>`).join('')}</table><p class="ev">Answered earlier by a person: ConfigMap <span class="mono">agent-code</span> holds no address of its own.</p>`},
 {k:'Lock it, safely', t:'Lock it, safely', p:()=>`Four locks, one at a time. Each is <b>tested three times</b> before it goes live - and you approve it.`, pic:()=>picLock(S.locked.length),
   go:()=>S.locked.length>=D.stages.length?'Next':`Test and lock stage ${D.stages[S.locked.length].k}`, act:async()=>{ const i=S.locked.length, s=D.stages[i]; for(const p of ['rehearsal','replay','watching']) { log('ok',`Stage ${s.k} ${p}: passed`); await wait(250); } S.locked.push(i); log('ok',`Stage ${s.k} locked: ${s.policies.map(p=>p.name).join(', ')}`); draw(); },
   done:()=>S.locked.length>=D.stages.length, proofs:true,
   more:()=>D.stages.map(s=>`<p style="margin:10px 0 0"><b style="color:var(--ink)">Stage ${s.k} · ${esc(s.name)}</b> - ${s.policies.length} ${s.engine} ${s.policies.length>1?'policies':'policy'}</p>${s.policies.map(p=>`<details><summary class="mono" style="cursor:pointer;color:var(--info)">${esc(p.name)} · ${esc(p.kind)}</summary><div class="yaml">${esc(p.yaml.replace('value: monitor','value: enforce'))}</div></details>`).join('')}`).join('')},
 {k:'Try again', t:'Try the attack again', p:()=>`The same poisoned task, the same code - now on the secured agent.`, pic:()=>picAttack(S.a1,true),
   go:()=>S.a1>=ATT.length?'See what it took':'Run the test attack again', red:()=>S.a1<ATT.length, act:async()=>{ for(let i=S.a1;i<ATT.length;i++){ S.a1=i+1; const [k,t]=ATT[i], e=(D.attack.engine||[]).find(EVM[k]); log('ok',`Test attack (after): ${t} - blocked${e?` · ${e.engine} ${e.action} (${e.why})`:''}`); draw(); await wait(550); } },
   done:()=>S.a1>=ATT.length, engine:true,
   res:()=>{ const nb=ATT.filter(([k])=>!(D.attack.after[k]||{}).ok).length; return S.a1>=ATT.length?`<div class="result ok"><b>${nb} of ${ATT.length} blocked.</b> The agent kept doing its job - nothing it needs was dropped.</div>`:''; }},
 {k:'Done', t:'Your agent is secured', p:()=>`From wide open to only what it needs, on a real cluster - and proven twice: before it went live, and by the attack.`, pic:()=>picAttack(ATT.length,true), go:'See the policies', act:async()=>{ S.view='policies'; draw(); }, summary:true}];
function proofsBlock(){ return `<div class="proofs"><h3>The proof</h3><p class="sub">Shown for every stage, from the lab run. Nothing is locked until all three pass.</p>
  <table class="ptab"><tr><th>Stage</th><th>Rehearsal</th><th>Replay</th><th>Watching</th><th>Status</th></tr>${D.stages.map((s,i)=>{ const on=S.locked.includes(i), ok=s.proof.verdict==='PASS';
   return `<tr><td><b style="color:var(--ink)">${s.k} · ${esc(s.name)}</b><span class="ev">${esc(s.engine)}</span></td>
   <td><span class="chk ${on?'':'no'}">${on&&ok?'✓ passed':'waiting'}</span><span class="ev">every need still allowed, on the profile</span></td>
   <td><span class="chk ${on?'':'no'}">${on&&ok?'✓ passed':'waiting'}</span><span class="ev">${esc((s.proof.lines||[]).find(l=>/Replay/.test(l))||'recorded traffic and programs replayed')}</span></td>
   <td><span class="chk ${on?'':'no'}">${on&&s.watching?'✓ passed':'waiting'}</span><span class="ev">${D.watching.minutes} min log-only, ${D.watching.flows} flows: nothing would be dropped</span></td>
   <td>${on?'<span class="badge b-ok">locked</span>':'<span class="badge b-dim">open</span>'}</td></tr>`; }).join('')}</table></div>`; }
function engineBlock(){ return `<div class="proofs"><h3>What the engines recorded</h3><p class="sub">Not our word for it: the kernel engines logged each stop during the attack.</p>
  <table class="ptab"><tr><th>Attempt</th><th>Stopped by</th><th>Engine record</th></tr>${ATT.slice(0,S.a1).map(([k,t,l,st])=>{ const e=(D.attack.engine||[]).find(EVM[k]), r=D.attack.after[k]||{};
   return `<tr><td><b style="color:var(--ink)">${t}</b><span class="ev mono">${esc(r.detail)}</span></td><td>Stage ${st} · ${l}</td><td>${e?`<span class="mono" style="color:var(--ok)">${e.engine==='cilium'?'Cilium':'Tetragon'}: ${esc(e.action)} · ${esc(e.why)}</span><span class="ev mono">${esc(e.what.replace(/\/\.\.[^/]+/,''))}</span>`:''}</td></tr>`; }).join('')}</table></div>`; }
function summaryBlock(){ const sec=Math.round((Date.now()-S.t0)/1000), auto=D.profile.length-Q.length;
  return `<div class="proofs"><h3>What it took</h3><div class="grid g4" style="margin-top:10px">
   <div class="card kpi"><span>Your time</span><b>${Math.floor(sec/60)}m ${sec%60}s</b><span>start to secured</span></div>
   <div class="card kpi"><span>Your decisions</span><b>${Q.length}</b><span>accepted in one click</span></div>
   <div class="card kpi"><span>Your approvals</span><b>${D.stages.length}</b><span>one per stage, after its proof</span></div>
   <div class="card kpi"><span>Decided for you</span><b>${auto}</b><span>of ${D.profile.length} profile rows</span></div></div>
   <p class="ev" style="margin-top:12px">Policies written by hand: 0. ${D.stages.reduce((a,s)=>a+s.policies.length,0)} Cilium and Tetragon policies were written from the profile. Machine time in the lab: one recording of each kind and ${D.watching.minutes} minutes of log-only watching.</p></div>`; }
function tour(){ const st=STEPS[S.at], go=typeof st.go==='function'?st.go():st.go, done=!st.done||st.done();
  $('prog').innerHTML=STEPS.map((x,i)=>`<div class="${i<S.at?'d':i===S.at?'n':''}"><i class="${i<S.at?'d':i===S.at?'n':''}"></i><span>${x.k}</span></div>`).join('');
  return `<div class="tour"><div class="pic"><svg viewBox="0 0 640 400">${st.pic()}</svg></div>
   <div class="coach"><div class="k">STEP ${S.at+1} OF ${STEPS.length}</div><h1>${st.t}</h1><p>${st.p()}</p>${st.res?st.res():''}
   <button class="go ${st.red&&st.red()?'red':''}" id="go">${go} ›</button>${S.at?'<button class="back" id="back">‹ Back</button>':''}</div></div>
   ${st.proofs?proofsBlock():''}${st.engine&&S.a1?engineBlock():''}${st.summary?summaryBlock():''}
   ${st.more?`<details class="more"><summary>Show the details</summary><div class="in">${st.more()}</div></details>`:''}`; }
function policies(){ const all=D.stages.flatMap((s,i)=>s.policies.map(p=>({...p,stage:s.k,engine:s.engine,on:S.locked.includes(i)}))); const sel=all.find(p=>p.name===S.pol)||all[0];
  $('prog').innerHTML='';
  return `<h2>Policies</h2><p class="lead">Every policy written for ${esc(D.namespace)} - Cilium and Tetragon, from the profile. None by hand.</p>
  <div class="tour" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)"><div class="card" style="padding:8px"><table class="tbl">${all.map(p=>`<tr data-pol="${esc(p.name)}" style="cursor:pointer"><td class="mono" style="color:var(--ink)">${esc(p.name)}</td><td class="ev" style="margin:0">stage ${p.stage}</td><td><span class="badge ${p.on?'b-ok':'b-dim'}">${p.on?'locked':'proposed'}</span></td></tr>`).join('')}</table></div>
  <div class="card"><b class="mono" style="color:var(--ink)">${esc(sel.name)}</b> <span class="badge b-info">${esc(sel.kind)}</span><div class="yaml" style="max-height:60vh">${esc(sel.on?sel.yaml.replace('value: monitor','value: enforce'):sel.yaml)}</div></div></div>`; }
function activity(){ $('prog').innerHTML='';
  return `<h2>Activity</h2><p class="lead">What happened in this session, newest first.</p><div class="card">${ACT.length?`<table class="tbl">${ACT.map(a=>`<tr><td class="mono" style="color:var(--muted)">${a.t}</td><td><span class="badge ${a.k==='ok'?'b-ok':a.k==='bad'?'b-bad':a.k==='warn'?'b-warn':'b-info'}">${a.k==='ok'?'ok':a.k==='bad'?'attack':a.k==='warn'?'decision':'learned'}</span> ${esc(a.txt)}</td></tr>`).join('')}</table>`:'<p class="ev">Nothing yet - start with “Secure your first agent”.</p>'}</div>`; }
function draw(){ document.querySelectorAll('.side [data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===S.view&&!a.id)); $('nact').textContent=ACT.length||'';
  $('body').innerHTML=S.view==='tour'?tour():S.view==='policies'?policies():activity();
  const g=$('go'); if(g) g.onclick=async()=>{ const st=STEPS[S.at]; if(st.act&&!(st.done&&st.done())){ g.disabled=true; await st.act(); return; } if(st.act&&!st.done){ await st.act(); return; } if(S.at<STEPS.length-1){ S.at++; draw(); $('body').scrollTop=0; } };
  if($('back')) $('back').onclick=()=>{ S.at--; draw(); };
  document.querySelectorAll('[data-pol]').forEach(r=>r.onclick=()=>{ S.pol=r.dataset.pol; draw(); }); }
document.querySelectorAll('.side [data-v]').forEach(a=>a.onclick=()=>{ S.view=a.dataset.v; draw(); });
draw();
</script>
</body>
</html>
