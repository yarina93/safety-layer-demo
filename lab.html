      <div>${cur==='enforced'?'':ix<3?`<button class="btn" data-p="${i}">Run the proof</button>`:`<button class="btn go" data-e="${i}">Approve & enforce</button>`}</div></div>`; }).join('')}
  <div class="log" id="hlog">${hlog.join('<br>')||'<span class="mut">$ no stage run yet</span>'}</div>
  <div class="actions">${D.stages.every((s,i)=>st.stage[i]==='enforced')?next('Verify with the attack'):'<span class="note">Prove and enforce every stage to continue.</span>'}</div>`; }
let hlog=[];
async function runProof(i){ const s=D.stages[i]; for(const p of ['rehearsal','replay','watching']){ st.stage[i]=p; log('ok',`Stage ${s.k} ${p}: PASS`); hlog.push(`<span class="mut">[stage ${s.k}]</span> ${p}${p==='watching'?` - ${s.engine==='Cilium'?'Cilium PolicyAuditMode on the agents endpoints':'Tetragon policy-mode monitor'}`:''} … <span class="ok">PASS</span>`); draw(); await wait(500); } }
function enforce(i){ const s=D.stages[i]; st.stage[i]='enforced'; log('ok',`Stage ${s.k} approved and enforced: ${s.policies.map(p=>p.name).join(', ')}`); hlog.push(`<span class="mut">[stage ${s.k}]</span> approved · applied ${s.engine==='Cilium'?'CiliumNetworkPolicy':'TracingPolicyNamespaced (enforce)'} <span class="ok">✓</span>`); toast(`Stage ${s.k} enforced`); draw(); }
// ---------- 6 Verify ----------
function verify(){ const nb=ATT.filter(([k])=>!(D.attack.after[k]||{}).ok).length;
  return `<h2>Verify</h2><p class="lead">The same poisoned task, the same code - now against the hardened agent. The engines record every stop.</p>
  <div class="grid g2"><div class="card"><h3>Before <span class="badge b-bad">5 of 5 succeeded</span></h3><div class="log">${attackLog('before',ATT.length)}</div></div>
  <div class="card"><h3>After ${st.verify>=ATT.length?`<span class="badge b-ok">${nb} of 5 blocked</span>`:''}</h3><div class="log" id="alog2">${attackLog('after',st.verify)}</div><div class="actions"><button class="btn red" id="att2" ${st.verify>=ATT.length?'disabled':''}>Run attack simulation</button></div></div></div>
  ${st.verify>=ATT.length?`<div class="card" style="margin-top:14px"><h3>Result</h3><table><tr><th>Attempt</th><th>Before</th><th>After</th><th>Stopped by</th></tr>${ATT.map(([k,t,l,s])=>{ const e=(D.attack.engine||[]).find(EVM[k]); return `<tr><td class="ink">${t}</td><td><span class="badge b-bad">succeeded</span></td><td><span class="badge ${(D.attack.after[k]||{}).ok?'b-bad':'b-ok'}">${(D.attack.after[k]||{}).ok?'succeeded':'blocked'}</span></td><td class="ev">Stage ${s} · ${l}${e?` · ${esc(e.engine)} ${esc(e.action)} (${esc(e.why)})`:''}</td></tr>`; }).join('')}</table>
  <p class="ev" style="margin:12px 0 0">The agent kept working during and after: its tasks, the model, kb, model-store and its tools - nothing it needs was dropped.</p></div>
  ${(()=>{ const sec=Math.round((Date.now()-T0)/1000), q=Object.keys(st.decided).length, auto=D.profile.length-D.profile.filter(r=>r.view==='SUSPECT'||r.view==='ASK').length;
    return `<div class="card" style="margin-top:14px"><h3>What it took <span class="badge b-info">summary</span></h3><div class="grid g4">
      <div class="kpi"><span>Your time</span><b>${Math.floor(sec/60)}m ${sec%60}s</b><span>from discover to verified</span></div>
      <div class="kpi"><span>Your decisions</span><b>${q+1}</b><span>${q} questions + 1 ConfigMap checked</span></div>
      <div class="kpi"><span>Your approvals</span><b>${D.stages.length}</b><span>one per stage, each after its proof</span></div>
      <div class="kpi"><span>Decided for you</span><b>${auto}</b><span>of ${D.profile.length} profile rows, from the evidence</span></div></div>
      <p class="ev" style="margin:12px 0 0">Machine time in the lab: one recording of each kind (network, programs, files) and ${D.watching.minutes} minutes of log-only Watching before enforcement. No policy was written by hand.</p></div>`; })()}`:''}`; }
function draw(){ document.querySelectorAll('.side [data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('npol').textContent=D.stages.reduce((a,s)=>a+s.policies.length,0); $('nact').textContent=ACT.length||'';
  $('steps').style.display=view==='workload'?'':'none';
  header(); if(view!=='workload') $('steps').style.display='none';
  $('body').innerHTML=view==='workload'?[discover,collect,profile,decide,harden,verify][st.step]():view==='policies'?policiesView():view==='activity'?activityView():overviewView(); bind(); bindNext(); }
let polSel=null;
function policiesView(){ const two=st.stage[D.stages.findIndex(x=>x.k===2)]==='enforced';
  const all=D.stages.flatMap(s=>s.policies.map(p=>{ let state=st.stage[D.stages.indexOf(s)]||'proposed'; if(s.k===1&&two&&state==='enforced') state='replaced';
    return {...p,stage:s.k,engine:s.engine,state,yaml:state==='enforced'?p.yaml.replace('value: monitor','value: enforce'):p.yaml}; })); const sel=all.find(p=>p.name===polSel)||all[0];
  return `<h2>Policies</h2><p class="lead">Every policy the product wrote for ${esc(D.namespace)}: engine-native, ready to apply. None was written by hand. Click one to read it.</p>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)"><div class="card"><table><tr><th>Policy</th><th>Kind</th><th>Stage</th><th>Status</th></tr>${all.map(p=>`<tr style="cursor:pointer" data-pol="${esc(p.name)}"><td class="mono ink">${esc(p.name)}</td><td class="ev">${esc(p.kind)}</td><td>${p.stage}</td><td><span class="badge ${p.state==='enforced'?'b-ok':p.state==='watching'?'b-warn':'b-dim'}">${p.state==='enforced'?'enforced':p.state==='replaced'?'replaced by stage 2':p.state==='proposed'?'proposed':'proving'}</span></td></tr>`).join('')}</table></div>
  <div class="card"><h3><span class="mono">${esc(sel.name)}</span><span class="badge b-info">${esc(sel.kind)}</span></h3><div class="yaml" style="max-height:62vh">${esc(sel.yaml)}</div></div></div>`; }
function activityView(){ return `<h2>Activity</h2><p class="lead">Everything that happened in this session, newest first - collection, proofs, approvals, and what the engines recorded during the attack.</p>
  <div class="card">${ACT.length?`<table><tr><th>Time</th><th>Event</th></tr>${ACT.map(a=>`<tr><td class="mono mut">${a.t}</td><td><span class="badge ${a.k==='ok'?'b-ok':a.k==='bad'?'b-bad':a.k==='warn'?'b-warn':'b-info'}" style="margin-right:8px">${a.k==='ok'?'ok':a.k==='bad'?'attack':a.k==='warn'?'decision':'info'}</span>${esc(a.txt)}</td></tr>`).join('')}</table>`:'<p class="ev" style="margin:0">Nothing yet. Start with Secure the agent.</p>'}</div>`; }
function overviewView(){ const enf=Object.values(st.stage).filter(x=>x==='enforced').length;
  return `<h2>Overview</h2><p class="lead">The lab cluster: k3s on two nodes, Cilium 1.20 and Tetragon. This page follows one namespace, ${esc(D.namespace)}.</p>
  <div class="grid g4">${[['Workloads',D.workloads.length,D.workloads.map(w=>w.name).join(' · ')],['Stages enforced',`${enf} / ${D.stages.length}`,'network, programs, files'],['Policies written',D.stages.reduce((a,s)=>a+s.policies.length,0),'Cilium and Tetragon'],['Attack attempts blocked',st.verify>=ATT.length?`${ATT.filter(([k])=>!(D.attack.after[k]||{}).ok).length} / ${ATT.length}`:'-','after hardening']].map(([k,v,x])=>`<div class="card kpi"><span>${k}</span><b>${v}</b><span>${esc(x)}</span></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>Workloads in ${esc(D.namespace)}</h3><table><tr><th>Workload</th><th>Image</th><th>Hardening</th></tr>${D.workloads.map(w=>`<tr><td class="ink">${esc(w.name)}</td><td class="mono">${esc(w.image)}</td><td>${w.name==='agent'?`<a data-v2="workload" style="cursor:pointer">${enf?enf+' of '+D.stages.length+' stages enforced':'Start hardening ›'}</a>`:'<span class="mut">covered by the namespace stages</span>'}</td></tr>`).join('')}</table></div>`; }
function bind(){ const q=s=>document.querySelector(s);
  if(q('#att')) q('#att').onclick=()=>runAttack('before','attack0');
  if(q('#att2')) q('#att2').onclick=()=>runAttack('after','verify');
  if(q('#col')) q('#col').onclick=runCollect;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ st.filter=b.dataset.f; draw(); });
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ st.decided[b.dataset.d]=b.dataset.a; log('warn',`Decision: ${D.profile.filter(r=>r.view==='SUSPECT'||r.view==='ASK')[b.dataset.d].what} - ${b.dataset.a==='close'?'kept closed':'kept open'}`); draw(); });
  if(q('#all')) q('#all').onclick=()=>{ D.profile.filter(r=>r.view==='SUSPECT'||r.view==='ASK').forEach((r,i)=>{ if(!st.decided[i]) st.decided[i]=r.view==='SUSPECT'?'close':'keep'; }); draw(); };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>runProof(+b.dataset.p));
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>enforce(+b.dataset.e));
  document.querySelectorAll('[data-pol]').forEach(b=>b.onclick=()=>{ polSel=b.dataset.pol; view='policies'; draw(); });
  document.querySelectorAll('[data-v2]').forEach(b=>b.onclick=()=>{ view='workload'; draw(); }); bindNext(); }
document.querySelectorAll('.side [data-v]').forEach(a=>{ a.style.cursor='pointer'; a.onclick=()=>{ view=a.dataset.v; draw(); }; });
draw();
</script>
</body>
</html>
