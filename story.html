<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Safety Layer Walkthrough</title>
<meta name="description" content="How the Decision & Safety Layer takes a Kubernetes namespace from default-allow to least privilege on Cilium and Tetragon, step by step, with the lab evidence behind every rule.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Phone-first engineering walkthrough. Each card has two parts that do different jobs:
   the window on top SHOWS the mechanism happening (flows arriving, verdicts stamped, policy compiled, replay running),
   the text below EXPLAINS why. Every value comes from the lab run on boutique. On a computer: a phone-width column. */
:root{
  --bg:#0A0D14; --panel:#10151F; --panel2:#151C29; --ink:#E6EAF2; --text:#B9C2D3; --muted:#7D889C; --dim:#4F5A6E; --line:#222B3A;
  --ok:#3DD68C; --bad:#FF5C5C; --warn:#F5B947; --info:#6EA8FE; --prog:#B392F0; --amber:#F5B947;
  --body:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden}
.phone{position:relative;height:100vh;height:100dvh;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}
@media (min-width:600px){body{background:radial-gradient(80% 60% at 50% 0%, #141B2B 0%, var(--bg) 70%)}
  .phone{height:min(100dvh, 880px);top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:28px;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.5)}}
/* top: progress, product, blast radius */
.bars{display:flex;gap:3px;flex:none}
.bars i{flex:1;height:2.5px;border-radius:2px;background:#232C3C;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink);transition:width .3s ease}
.bars i.pd b{width:100%;background:#8893A8}.bars i.pn b{width:100%}
.head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 8px}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink)}
.brand svg{width:20px;height:20px}
.brand span{font-weight:500;color:var(--muted)}
.blast{display:flex;align-items:center;gap:7px;font:600 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.blast b{font-size:13px;color:var(--bad);font-variant-numeric:tabular-nums;transition:color .4s}
.blast.zero b{color:var(--ok)}
.blast.pop b{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.25)}}
/* the pipeline, always visible once the product starts working */
.pipe{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-bottom:8px;transition:opacity .3s}
.pipe span{font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:5px 0 4px;border-radius:6px;color:var(--dim);background:var(--panel);border:1px solid var(--line)}
.pipe span.d{color:var(--muted)}
.pipe span.n{color:#0A0D14;background:var(--ink);border-color:var(--ink)}
.pipe.off{opacity:.35}
/* the window: where the mechanism happens */
.win{flex:none;height:clamp(250px, 45dvh, 372px);display:flex;flex-direction:column;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.wbar{flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel2);font:600 11px var(--mono);color:var(--muted)}
.wbar i{width:8px;height:8px;border-radius:50%;background:#2A3344}
.wbar span{margin-left:4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar em{margin-left:auto;font-style:normal;color:var(--dim);white-space:nowrap}
.wbody{flex:1;min-height:0;position:relative;overflow:hidden;padding:10px 12px;font:11.5px/1.6 var(--mono);color:var(--text)}
.wfoot{flex:none;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--line);font:600 10.5px var(--mono);color:var(--muted)}
.wfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
/* terminal */
.t div{white-space:pre;min-height:1.6em}
.t>div{opacity:0;transition:opacity .2s}.t>div.on{opacity:1}
.t .p{color:var(--ink)}.t .p::before{content:'$ ';color:var(--ok)}
.t .c{color:var(--dim)}
.t .ok{color:var(--ok)}.t .bad{color:var(--bad)}.t .warn{color:var(--warn)}.t .info{color:var(--info)}
.cur{display:inline-block;width:7px;height:1.1em;vertical-align:-2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{display:inline-block;width:110px;height:8px;border-radius:2px;background:#232C3C;vertical-align:0;margin:0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--info)}
/* verdict rows */
.rows{display:grid;gap:6px}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  opacity:0;transform:translateY(4px);transition:opacity .3s ease,transform .3s ease,border-color .3s}
.r.on{opacity:1;transform:none}
.r .a{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .e{grid-column:1;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{grid-row:1 / span 2;grid-column:2}
.tag{display:inline-block;font:800 9.5px var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:5px;border:1px solid;font-style:normal;opacity:0;transform:scale(1.4);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
.tag.on{opacity:1;transform:none}
.tag.g{color:var(--ok);border-color:rgba(61,214,140,.4);background:rgba(61,214,140,.08)}
.tag.b{color:var(--info);border-color:rgba(110,168,254,.4);background:rgba(110,168,254,.08)}
.tag.x{color:var(--bad);border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.08)}
.tag.y{color:var(--warn);border-color:rgba(245,185,71,.4);background:rgba(245,185,71,.08)}
.r.scan{border-color:var(--info)}
/* yaml */
.y div{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:pre;min-height:1.6em;opacity:0;transition:opacity .2s}
.y div.on{opacity:1}
.y .k{color:var(--info)}.y .s{color:var(--ok)}.y .c{color:var(--dim)}
.y .tag{font-size:8.5px;padding:1px 5px}
/* process tree */
.tree div{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:pre;min-height:1.75em;opacity:0;transition:opacity .25s}
.tree div.on{opacity:1}
.tree .g{color:var(--dim)}.tree .n{color:var(--ink)}.tree .w{color:var(--muted);font-size:10px}
/* diff */
.diff div{white-space:pre;padding:2px 12px;margin:0 -12px;opacity:0;transition:opacity .25s}
.diff div.on{opacity:1}
.diff .m{background:rgba(255,92,92,.09);color:#FF9C9C}.diff .pl{background:rgba(61,214,140,.09);color:#8FEBBE}.diff .h{color:var(--muted)}
/* svg scenes */
.wbody svg{display:block;width:100%;height:100%}
svg text{font-family:var(--mono)}
.mp .ew{stroke:#FF5C5C;stroke-width:.6;opacity:.16;transition:opacity .5s}
.mp .need{stroke:#8893A8;stroke-width:1.1;fill:none;opacity:.55;transition:stroke .5s,opacity .5s,stroke-width .5s}
.mp.l3 .need{stroke:var(--ok);stroke-width:1.8;opacity:.9}
.mp .rl{stroke:var(--amber);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .35s ease,opacity .45s}
.mp .rl.on{stroke-dashoffset:0}
.mp.l1 .r-api,.mp.l2 .r-web,.mp.l3 .r-ew,.mp.l3 .ew{opacity:0}
.mp .node{fill:#10151F;stroke:#8893A8;stroke-width:1.6;transition:stroke .5s}
.mp.l3 .node{stroke:var(--ok)}
.mp .atk{fill:rgba(245,185,71,.12);stroke:var(--amber);stroke-width:1.6}
.mp text{fill:#9AA5B8;font-size:8.5px;text-anchor:middle}
.mp .hub{fill:#10151F;stroke:#566175;stroke-width:1.6;transition:stroke .4s}
.mp .x{stroke:var(--bad);stroke-width:2.6;stroke-linecap:round;opacity:0;transition:opacity .4s ease .3s}
.mp.l1 .xa,.mp.l2 .xw{opacity:1}
.src rect{fill:var(--panel2);stroke:var(--line)}
.src .lbl{fill:var(--ink);font-size:10.5px;font-weight:700}
.src .sub{fill:var(--muted);font-size:9px}
.src .num{fill:var(--info);font-size:10px;font-weight:700}
.src .flow{stroke:var(--info);stroke-width:1.2;fill:none;stroke-dasharray:3 5;opacity:0;transition:opacity .4s}
.src .flow.on{opacity:.8;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.src .wl{fill:var(--dim);font-size:9px;transition:fill .3s}
.src .wl.on{fill:var(--ink)}
.src .ck{fill:var(--ok);font-size:9px;opacity:0;transition:opacity .3s}
.src .ck.on{opacity:1}
/* text card */
.txt{flex:1;min-height:0;overflow:auto;padding:12px 2px 6px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.txt.in{animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.kick{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.txt h1{font-size:22px;line-height:1.2;letter-spacing:-.015em;margin:5px 0 8px;text-wrap:balance}
.txt p{margin:0 0 9px;color:var(--text);font-size:14.5px}
.txt p b{color:var(--ink);font-weight:650}
.txt code{font-family:var(--mono);font-size:.86em;color:var(--ink);background:var(--panel2);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.stg{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.stg li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;color:var(--text)}
.stg li i{font-style:normal;font:700 11px var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.stg li.ok i{background:var(--ok);border-color:var(--ok);color:#0A0D14}
.stg li.now i{border-color:var(--ink);color:var(--ink)}
.stg li b{color:var(--ink);font-weight:650}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .btn{animation:none}
.act{margin-top:auto;padding-top:8px;display:grid;gap:8px}
.btn{font:inherit;font-weight:700;font-size:15px;padding:13px 16px;border-radius:12px;border:0;background:var(--ink);color:#0A0D14;cursor:pointer;width:100%;animation:pulse 1.8s ease-out infinite}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);animation:none}
.btn:disabled{opacity:.55;animation:none}
.btn:focus-visible{outline:2px solid var(--info);outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,234,242,.35)}100%{box-shadow:0 0 0 12px rgba(230,234,242,0)}}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;padding-top:4px;font:600 10.5px var(--mono);color:var(--dim)}
.foot .hint{color:var(--muted)}
@media (max-height:700px){.win{height:clamp(220px, 42dvh, 300px)}.txt h1{font-size:19px;margin:3px 0 6px}.txt p{font-size:13.5px;margin-bottom:7px}.wbody{font-size:10.5px;padding:8px 10px;line-height:1.45}.rows{gap:4px}.r{padding:2px 7px}.r .e{font-size:10px}.head{margin:8px 0 6px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="bars" id="bars" aria-hidden="true"></div>
  <div class="head">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 35 9v10c0 9.5-6.4 15.8-15 18-8.6-2.2-15-8.5-15-18V9z" fill="#2B3A55"/><path d="M12 15h16M12 20.5h16M12 26h10" stroke="#E6EAF2" stroke-width="2.6" stroke-linecap="round"/><circle cx="27" cy="26" r="3.2" fill="#3DD68C"/></svg>Safety Layer <span>· boutique</span></div>
    <div class="blast" id="blast" aria-live="polite">blast radius <b id="bN">13</b></div>
  </div>
  <div class="pipe off" id="pipe" aria-label="Pipeline"><span>Collect</span><span>Classify</span><span>Compile</span><span>Verify</span><span>Enforce</span></div>
  <div class="win" aria-hidden="true"><div class="wbar"><i></i><i></i><i></i><span id="wt"></span><em id="wm"></em></div><div class="wbody" id="wb"></div><div class="wfoot" id="wf"></div></div>
  <section class="txt" id="txt" aria-live="polite"></section>
  <div class="foot"><span class="hint" id="hint"></span><span id="count"></span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
// ---------- timeline helpers: every card's animation restarts on entry and stops on exit
let timers=[];
const later=(ms,f)=>timers.push(setTimeout(f, reduce?0:ms));
const stop=()=>{ timers.forEach(clearTimeout); timers=[]; };
const tick=(el,to,ms,fmt=n=>n.toLocaleString('en-US'))=>{ if(reduce){ el.textContent=fmt(to); return; } const t0=performance.now();
  const f=t=>{ const k=Math.min(1,(t-t0)/ms); el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3)))); if(k<1&&el.isConnected) requestAnimationFrame(f); }; requestAnimationFrame(f); };
const reveal=(sel,step,start=0)=>[...$('wb').querySelectorAll(sel)].forEach((e,i)=>later(start+i*step,()=>e.classList.add('on')));
// ---------- state the viewer changes
const S={lvl:0, replay:false, prog:false};
function blast(){ const n=(S.lvl<3?11:0)+(S.lvl<1?1:0)+(S.lvl<2?1:0), b=$('blast'), was=$('bN').textContent;
  $('bN').textContent=n; b.classList.toggle('zero',!n); if(String(n)!==was){ b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); } }
// ---------- the shop's map (lab topology: 12 workloads, 16 required flows between them)
const VN={loadgen:[22,128],frontend:[80,128],ad:[156,46],recommend:[156,90],checkout:[156,172],email:[156,226],
  catalog:[236,50],currency:[236,94],cart:[236,138],shipping:[236,182],payment:[236,226],redis:[304,138]};
const NEED=[['loadgen','frontend'],['frontend','ad'],['frontend','recommend'],['frontend','checkout'],['frontend','catalog'],['frontend','currency'],['frontend','cart'],['frontend','shipping'],
  ['recommend','catalog'],['checkout','catalog'],['checkout','currency'],['checkout','cart'],['checkout','shipping'],['checkout','payment'],['checkout','email'],['cart','redis']];
function mapSVG(){
  const K=Object.keys(VN), A=[24,20], W=[306,20], [ax,ay]=VN.ad;
  const cv=(a,b)=>{ const [x1,y1]=VN[a],[x2,y2]=VN[b]; if(x1===x2) return `M${x1} ${y1}L${x2} ${y2}`; const m=(x1+x2)/2; return `M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}`; };
  let ew=''; for(let i=0;i<K.length;i++) for(let j=i+1;j<K.length;j++){ const [x1,y1]=VN[K[i]],[x2,y2]=VN[K[j]]; ew+=`<line class="ew" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
  const need=NEED.map(([a,b])=>`<path class="need" d="${cv(a,b)}"/>`).join('');
  const reach=K.filter(k=>k!=='ad').map(k=>`<line class="rl r-ew" pathLength="1" x1="${ax}" y1="${ay}" x2="${VN[k][0]}" y2="${VN[k][1]}"/>`).join('')+
    `<line class="rl r-api" pathLength="1" x1="${ax}" y1="${ay}" x2="${A[0]}" y2="${A[1]}"/><line class="rl r-web" pathLength="1" x1="${ax}" y1="${ay}" x2="${W[0]}" y2="${W[1]}"/>`;
  const nodes=K.map(k=>{ const [x,y]=VN[k]; return `<circle class="${k==='ad'?'node atk':'node'}" cx="${x}" cy="${y}" r="${k==='ad'?8:6.5}"/><text x="${x}" y="${y+17}">${k}</text>`; }).join('');
  const hub=([x,y],lab,cls,dx)=>`<circle class="hub" cx="${x}" cy="${y}" r="9"/><path class="x ${cls}" d="M${x-6} ${y-6}L${x+6} ${y+6}M${x+6} ${y-6}L${x-6} ${y+6}"/><text x="${x+dx}" y="${y+3}" style="fill:#7D889C">${lab}</text>`;
  return `<svg class="mp" id="mp" viewBox="0 0 330 248" preserveAspectRatio="xMidYMid meet">${ew}${need}${reach}${hub(A,'kube-apiserver','xa',50)}${hub(W,'world','xw',-30)}${nodes}</svg>`;
}
function setMap(){ const m=$('mp'); if(!m) return; m.classList.remove('l1','l2','l3'); for(let i=1;i<=S.lvl;i++) m.classList.add('l'+i); }

// ---------- the cards: [window = the mechanism] + [text = why it matters]
const CARDS=[
 { pipe:-1, wt:'zsh · prod-cluster', wm:'today',
   win:`<div class="t">
     <div class="p">kubectl get deploy -n boutique</div>
     <div class="c">NAME              READY</div><div>adservice         1/1</div><div>checkoutservice   1/1</div><div class="c">… 10 more</div>
     <div class="p">kubectl get cnp -n boutique</div><div class="warn">No resources found in boutique namespace.</div>
     <div class="p">hubble observe -n boutique --last 3</div>
     <div>frontend → adservice:9555   <span class="ok">FORWARDED</span></div><div>checkout → payment:50051   <span class="ok">FORWARDED</span></div><div>cart → redis-cart:6379     <span class="ok">FORWARDED</span></div></div>`,
   foot:'<span>Cilium ✓  Hubble ✓  Tetragon ✓</span><span>policies <b>0</b></span>',
   play(){ reveal('.t>div',260); },
   kick:'The starting point', title:'The engines are installed. Nothing is enforced.',
   body:`<p>A typical namespace on day 2: 12 Deployments in production, Cilium as the CNI, Hubble and Tetragon collecting. But no <code>CiliumNetworkPolicy</code> has been written.</p>
         <p>So the namespace runs <b>default-allow</b>: every pod can open a connection to every other pod, to the kube-apiserver and to the internet.</p>` },
 { pipe:-1, wt:'reach · adservice', wm:'default-allow', map:true,
   foot:'<span>assume: adservice compromised</span><span>reachable <b id="rc">0</b></span>',
   play(){ const ls=[...$('wb').querySelectorAll('.rl')], rc=$('rc'); ls.forEach((l,i)=>later(400+i*170,()=>{ l.classList.add('on'); rc.textContent=i+1; })); },
   kick:'The exposure', title:'One compromised pod reaches the whole namespace.',
   body:`<p>Take adservice. Its job is to answer frontend on one port. Under default-allow its reach is <b>11 workloads, the kube-apiserver and egress to world</b>, and it can exec any binary in its image.</p>
         <p>That reach is the blast radius. Every pod in the namespace has the same one.</p>` },
 { pipe:-1, wt:'example · a hand-written policy', wm:'rollout',
   win:`<div class="t">
     <div class="c"># allow-list for frontend, written by hand</div>
     <div>egress:</div><div>- toEndpoints: [{app: productcatalogservice}]</div><div>- toEndpoints: [{app: cartservice}]</div><div>- toEndpoints: [{app: currencyservice}]</div>
     <div class="c">  # checkoutservice:5050 forgotten</div>
     <div class="p">kubectl apply -f frontend-cnp.yaml</div>
     <div class="p">hubble observe --verdict DROPPED</div>
     <div>frontend → checkout:5050   <span class="bad">DROPPED</span></div>
     <div class="bad">  policy denied · checkout path down</div></div>`,
   foot:'<span>16 required flows in this app</span><span>missed <b style="color:var(--bad)">1</b></span>',
   play(){ reveal('.t>div',300); },
   kick:'Why it stays open', title:'Writing policy by hand means guessing every dependency.',
   body:`<p>To lock a workload down you have to list every connection it needs. Miss one port and the rollout drops production traffic.</p>
         <p>So the team that owns the cluster leaves default-allow in place. <b>Enforcement is easy. Deciding what to allow, safely, is the hard part.</b> That decision is the product.</p>` },
 { pipe:0, wt:'decision-layer · collect', wm:'read-only',
   win:`<svg class="src" viewBox="0 0 330 250">
     <g><rect x="6" y="14" width="124" height="58" rx="8"/><text class="lbl" x="16" y="34">Manifests</text><text class="sub" x="16" y="49">specs · env · ports</text><text class="num" x="16" y="63"><tspan id="c1">0</tspan> Deployments</text></g>
     <g><rect x="6" y="96" width="124" height="58" rx="8"/><text class="lbl" x="16" y="116">Hubble</text><text class="sub" x="16" y="131">L3/L4 flow logs</text><text class="num" x="16" y="145"><tspan id="c2">0</tspan> flows</text></g>
     <g><rect x="6" y="178" width="124" height="58" rx="8"/><text class="lbl" x="16" y="198">Tetragon</text><text class="sub" x="16" y="213">process_exec events</text><text class="num" x="16" y="227">per container</text></g>
     <path class="flow" d="M130 43 C160 43 160 125 186 125"/><path class="flow" d="M130 125 L186 125"/><path class="flow" d="M130 207 C160 207 160 125 186 125"/>
     <rect x="186" y="14" width="138" height="222" rx="8"/><text class="lbl" x="196" y="34">Evidence per workload</text>
     ${['adservice','cartservice','checkoutservice','currencyservice','emailservice','frontend','loadgenerator','paymentservice','productcatalog…','recommendation…','redis-cart','shippingservice'].map((w,i)=>`<text class="ck" x="196" y="${56+i*15}">✓</text><text class="wl" x="208" y="${56+i*15}">${w}</text>`).join('')}
   </svg>`,
   foot:'<span>no new agents</span><span>sources <b>3</b></span>',
   play(){ const wb=$('wb'); wb.querySelectorAll('.flow').forEach((f,i)=>later(200+i*250,()=>f.classList.add('on')));
     later(300,()=>tick($('c1'),12,700)); later(550,()=>tick($('c2'),33411,1600));
     [...wb.querySelectorAll('.wl')].forEach((w,i)=>later(900+i*140,()=>{ w.classList.add('on'); wb.querySelectorAll('.ck')[i].classList.add('on'); })); },
   kick:'Step 1 · Collect', title:'Read what the cluster already produces.',
   body:`<p>The product reads three sources you already have: the <b>Deployment manifests</b>, <b>Hubble flow logs</b> from Cilium, and <b>Tetragon <code>process_exec</code> events</b>.</p>
         <p>No new agents, no new collection. The output is one evidence profile per workload: what it declares, and what it actually does.</p>` },
 { pipe:1, wt:'classify · adservice', wm:'24 paths',
   win:`<div class="rows">
     <div class="r"><span class="a">IN  frontend → :9555/TCP</span><span class="e">manifest env AD_SERVICE_ADDR · 144 flows</span><span class="v"><i class="tag g">CONFIRMED</i></span></div>
     <div class="r"><span class="a">IN  kubelet → :9555/TCP</span><span class="e">health probe · 583 flows</span><span class="v"><i class="tag g">CONFIRMED</i></span></div>
     <div class="r"><span class="a">OUT → kube-dns :53</span><span class="e">platform rule · every pod resolves names</span><span class="v"><i class="tag b">NEEDED</i></span></div>
     <div class="r"><span class="a">OUT → 11 workloads, any port</span><span class="e">not declared · 0 flows observed</span><span class="v"><i class="tag x">EXCESS ×11</i></span></div>
     <div class="r"><span class="a">IN  ← 10 workloads, any port</span><span class="e">not declared · 0 flows observed</span><span class="v"><i class="tag x">EXCESS ×10</i></span></div></div>`,
   foot:'<span>keep <b>3</b></span><span>excess <b style="color:var(--bad)">21</b></span>',
   play(){ const rs=[...$('wb').querySelectorAll('.r')];
     rs.forEach((r,i)=>{ later(200+i*520,()=>{ r.classList.add('on','scan'); }); later(500+i*520,()=>{ r.classList.remove('scan'); r.querySelector('.tag').classList.add('on'); }); }); },
   kick:'Step 2 · Classify', title:'Every path gets a verdict from evidence.',
   body:`<p>Each path a workload is allowed today is checked against its evidence. <b>Declared in a manifest and seen in traffic: confirmed.</b> Platform needs such as DNS and kubelet probes: needed.</p>
         <p>No declaration and no traffic: <b>excess</b>. That is attack surface with no business reason to exist.</p>` },
 { pipe:2, wt:'level3-adservice.yaml', wm:'generated',
   win:`<div class="y">
     <div><span><span class="k">apiVersion:</span> cilium.io/v2</span></div>
     <div><span><span class="k">kind:</span> CiliumNetworkPolicy</span></div>
     <div><span><span class="k">metadata:</span> {name: level3-adservice}</span></div>
     <div><span><span class="k">spec:</span></span></div>
     <div><span>  <span class="k">endpointSelector:</span> {app: adservice}</span></div>
     <div><span>  <span class="k">ingress:</span></span></div>
     <div><span>  - fromEndpoints: [{app: <span class="s">frontend</span>}]</span><i class="tag g">env</i></div>
     <div><span>    toPorts: [{port: <span class="s">"9555"</span>}]</span><i class="tag g">144 flows</i></div>
     <div><span>  <span class="k">egress:</span></span></div>
     <div><span>  - toEndpoints: [{k8s-app: <span class="s">kube-dns</span>}]</span><i class="tag b">platform</i></div>
     <div><span>    toPorts: [{port: <span class="s">"53"</span>}]</span></div>
     <div><span class="c">  # 21 excess paths: no rule → denied</span></div></div>`,
   foot:'<span>engine-native · no product CRDs</span><span>rules <b>2</b></span>',
   play(){ const ls=[...$('wb').querySelectorAll('.y div')]; ls.forEach((l,i)=>{ later(150+i*200,()=>{ l.classList.add('on'); const t=l.querySelector('.tag'); if(t) later(250,()=>t.classList.add('on')); }); }); },
   kick:'Step 3 · Compile', title:'Evidence becomes plain Cilium policy.',
   body:`<p>Confirmed and needed paths compile into a standard <code>CiliumNetworkPolicy</code>. Every rule points back to the evidence it came from. Excess paths get no rule, so they are denied.</p>
         <p>It is ordinary YAML in your cluster: <b>remove the product and the policy keeps enforcing.</b></p>` },
 { pipe:3, wt:'decision-layer verify', wm:'dry-run', act:'replay',
   win:`<div class="t" id="vt"><div class="p on">decision-layer verify boutique --replay</div><div class="on" id="vw"><span class="cur"></span></div></div>`,
   foot:'<span>cluster not touched</span><span id="vr">result <b>–</b></span>',
   play(){ if(S.replay) runReplay(true); },
   kick:'Step 4 · Verify', title:'Replay the proposal before it touches the cluster.',
   body:`<p>The proposed policies are replayed offline against <b>every flow Hubble recorded</b>. The check passes only if no required flow would be dropped.</p>
         <p>It also reports what the proposal closes, so you see both sides before deciding.</p>`,
   button:'Run the replay', busy:'Replaying…' },
 { pipe:4, wt:'boutique · enforcement', wm:'staged', map:true, act:'stages',
   foot:'<span id="ef"></span>',
   play(){ $('wb').querySelectorAll('.rl').forEach(l=>l.classList.add('on')); setMap(); efoot(); },
   kick:'Step 5 · Enforce', title:'Staged, approved by a person, reversible.',
   body:()=>`<ol class="stg">${[['Namespace isolation','deny kube-apiserver and cross-namespace traffic'],['Egress lock','deny egress to world; no workload calls out'],['East-west isolation','per-workload allow-lists; deny the 116 unused paths']]
       .map(([t,d],i)=>`<li class="${S.lvl>i?'ok':S.lvl===i?'now':''}"><i>${S.lvl>i?'✓':i+1}</i><span><b>${t}</b> · ${d}</span></li>`).join('')}</ol>
     <p>Each stage is its own policy set, applied only after approval and rolled back in one step.</p>`,
   button:()=>S.lvl<3?`Approve stage ${S.lvl+1}`:'', busy:'Applying…' },
 { pipe:1, wt:'tetragon · process_exec · adservice', wm:'runtime', act:'prog',
   win:`<div class="tree">
     <div><span><span class="g">containerd-shim-runc-v2</span></span></div>
     <div><span><span class="g">└─ </span><span class="n">AdService</span> <span class="w">ENTRYPOINT</span></span><i class="tag g">DECLARED</i></div>
     <div><span><span class="g">   │  </span><span class="n">/bin/sh</span> <span class="w">#! interpreter</span></span><i class="tag g">DECLARED</i></div>
     <div><span><span class="g">   ├─ </span><span class="n">java</span></span><i class="tag y" data-q>REVIEW</i></div>
     <div><span><span class="g">   ├─ </span><span class="n">sed</span></span><i class="tag y" data-q>REVIEW</i></div>
     <div><span><span class="g">   ├─ </span><span class="n">uname</span></span><i class="tag y" data-q>REVIEW</i></div>
     <div><span><span class="g">   ├─ </span><span class="n">tr</span></span><i class="tag y" data-q>REVIEW</i></div>
     <div><span><span class="g">   └─ </span><span class="n">xargs</span></span><i class="tag y" data-q>REVIEW</i></div>
     <div><span><span class="g">      └─ </span><span class="n">echo</span></span><i class="tag y" data-q>REVIEW</i></div></div>`,
   foot:'<span>allow-list <b id="al">2</b> binaries</span><span>any other exec → <b style="color:var(--bad)">deny</b></span>',
   play(){ const ls=[...$('wb').querySelectorAll('.tree div')]; ls.forEach((l,i)=>later(150+i*260,()=>{ l.classList.add('on'); const t=l.querySelector('.tag'); if(t) later(200,()=>t.classList.add('on')); })); if(S.prog) later(2600,markProg); },
   kick:'Runtime · same pipeline', title:'Processes get the same treatment.',
   body:`<p>Tetragon's <code>process_exec</code> events are compared with what the image declares. Two binaries are declared. Six more are started by the entrypoint <b>script</b>, which can't be resolved statically.</p>
         <p>The product doesn't guess. <b>Unresolved cases go to a person.</b> Are these part of normal startup?</p>`,
   button:'Yes, mark all 6 as needed', busy:'Recording decision…' },
 { pipe:-1, wt:'adservice · effective permissions', wm:'diff', end:true,
   win:`<div class="diff">
     <div class="h">@@ network · enforced @@</div>
     <div class="m">- egress   11 workloads, any port</div><div class="m">- egress   kube-apiserver</div><div class="m">- egress   world (0.0.0.0/0)</div><div class="m">- ingress  any pod in the namespace</div>
     <div class="pl">+ egress   kube-dns:53</div><div class="pl">+ ingress  frontend → :9555/TCP</div>
     <div class="h">@@ runtime · allow-list ready @@</div>
     <div class="m">- exec     any binary in the image</div><div class="pl">+ exec     8 binaries, reviewed</div></div>`,
   foot:'<span>blast radius <b style="color:var(--bad)">13</b> → <b style="color:var(--ok)">0</b> beyond DNS</span><span>required dropped <b>0</b></span>',
   play(){ reveal('.diff div',220); },
   kick:'Result', title:'adservice, before and after.',
   body:`<p>Network is enforced with plain <code>CiliumNetworkPolicy</code>. The runtime allow-list is ready for Tetragon enforcement. Zero required flows were dropped along the way.</p>
         <p><b>Next in the lab:</b> a real intrusion from adservice, a <code>kubectl exec</code> that calls the kube-apiserver and runs an unlisted binary, shown blocked on both layers.</p>` },
];
function efoot(){ const f=$('ef'); if(!f) return; const c=(on,a,b)=>`<b style="color:${on?'var(--ok)':'var(--bad)'}">${on?a:b}</b>`;
  f.innerHTML=`kube-apiserver ${c(S.lvl>=1,'denied','open')} · world ${c(S.lvl>=2,'denied','open')} · unused ${c(S.lvl>=3,'0','116')}`; }
function runReplay(instant){
  const w=$('vw'); if(!w) return;
  w.innerHTML=`<div>replaying flows<span class="bar"><i id="vb"></i></span></div><div class="c"><span id="vn">0</span> / 33,411 Hubble flows</div>`;
  const res=`<div>&nbsp;</div><div>required flows     17   <span class="ok">kept</span></div><div>required dropped    <span class="ok">0</span></div><div>unused paths      116   <span class="info">closed</span></div><div>kube-apiserver         <span class="info">denied</span></div><div>egress to world        <span class="info">denied</span></div><div>&nbsp;</div><div>RESULT  <span class="ok">PASS</span></div>`;
  const pass=()=>$('vr').innerHTML='result <b style="color:var(--ok)">PASS</b>';
  if(instant||reduce){ $('vb').style.width='100%'; $('vn').textContent='33,411'; w.insertAdjacentHTML('beforeend',res); pass(); return; }
  const b=$('vb'); b.style.transition='width 1.6s cubic-bezier(.3,.6,.4,1)'; requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width='100%')); tick($('vn'),33411,1600);
  later(1750,()=>{ w.insertAdjacentHTML('beforeend',res); [...w.children].slice(2).forEach((d,i)=>{ d.style.opacity=0; later(i*140,()=>{ d.style.transition='opacity .2s'; d.style.opacity=1; }); }); later(1150,pass); });
}
function markProg(){ $('wb').querySelectorAll('[data-q]').forEach((t,i)=>later(i*120,()=>{ t.className='tag g on'; t.textContent='NEEDED'; })); const a=$('al'); if(a) later(700,()=>a.textContent='8'); }
// ---------- navigation
let at=0;
$('bars').innerHTML=CARDS.map(()=>'<i><b></b></i>').join('');
const gated=c=>c.act==='replay'&&!S.replay||c.act==='stages'&&S.lvl<3||c.act==='prog'&&!S.prog;
function show(i){
  if(i<0||i>=CARDS.length) return; stop(); at=i; const c=CARDS[i];
  [...$('bars').children].forEach((s,k)=>s.className=k<i?'pd':k===i?'pn':'');
  const p=$('pipe'); p.classList.toggle('off',c.pipe<0); [...p.children].forEach((s,k)=>s.className=k<c.pipe?'d':k===c.pipe?'n':'');
  $('wt').textContent=c.wt; $('wm').textContent=c.wm;
  $('wb').innerHTML=c.map?mapSVG():c.win; $('wf').innerHTML=c.foot||'';
  if(c.map) setMap();
  render(); c.play&&c.play();
  $('count').textContent=`${i+1} / ${CARDS.length}`;
}
function render(){
  const c=CARDS[at], t=$('txt'), body=typeof c.body==='function'?c.body():c.body, label=typeof c.button==='function'?c.button():c.button;
  t.innerHTML=`<div class="kick">${c.kick}</div><h1>${c.title}</h1>${body}<div class="act">
    ${c.act&&gated(c)&&label?`<button class="btn" id="go">${label}</button>`:''}
    ${c.end?`<div class="two"><button class="btn" id="again">Start over</button><button class="btn sec" id="desk">Full tour</button></div>`:''}</div>`;
  t.classList.remove('in'); void t.offsetWidth; t.classList.add('in');
  if($('go')) $('go').onclick=e=>{ e.stopPropagation(); act(); };
  if($('again')) $('again').onclick=e=>{ e.stopPropagation(); S.lvl=0; S.replay=false; S.prog=false; blast(); show(0); };
  if($('desk')) $('desk').onclick=e=>{ e.stopPropagation(); location.href='index.html?desktop'; };
  $('hint').textContent=c.act&&gated(c)?'your turn · tap the button':c.end?'':'tap right to continue →';
}
function act(){
  const c=CARDS[at], g=$('go'); if(!g) return; g.disabled=true; g.textContent=c.busy;
  if(c.act==='replay'){ S.replay=true; runReplay(false); later(3000,render); }
  if(c.act==='stages'){ later(700,()=>{ S.lvl++; setMap(); efoot(); blast(); render(); }); }
  if(c.act==='prog'){ later(600,()=>{ S.prog=true; markProg(); render(); }); }
}
function next(){ const c=CARDS[at]; if(c.act&&gated(c)){ const g=$('go'); g&&g.animate&&g.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:280}); return; } show(at+1); }
function prev(){ show(at-1); }
// tap the right side to go on, the left third to go back, or swipe; buttons are left alone
let sx=null, sy=null;
$('phone').addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; });
$('phone').addEventListener('click',e=>{ if(e.target.closest('button,a')) return;
  if(sx!==null&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) return;
  const r=$('phone').getBoundingClientRect(); (e.clientX-r.left<r.width*.33)?prev():next(); });
$('phone').addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); sx=null; } });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); } if(e.key==='ArrowLeft') prev(); });
blast(); show(0);
</script>
