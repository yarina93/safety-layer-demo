<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>Safety Layer · Tour</title>
<meta name="description" content="Zero Trust inside the cluster: least privilege for every workload, decided from evidence and proven before it applies.">
<meta property="og:title" content="Safety Layer · The decision layer for runtime enforcement">
<meta property="og:description" content="Zero Trust inside the cluster: least privilege for every workload, decided from evidence and proven before it applies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#0A0D14;--panel:#10151F;--panel2:#141A25;--ink:#E9EDF5;--text:#B4BDCD;--muted:#7C879B;--dim:#4A5468;--line:#222A38;
  --ok:#4CC38A;--bad:#E5484D;--warn:#E8A33D;--info:#7AA2F7;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
.app{position:relative;max-width:460px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));overflow:hidden}
@media (min-width:700px){body{display:grid;place-items:center;min-height:100vh}.app{height:min(100dvh,880px);border:1px solid var(--line);border-radius:28px}}

/* header */
.top{flex:none;display:flex;align-items:center;gap:12px;height:28px}
.brand{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap}.brand svg{width:18px;height:18px}
.prog{flex:1;display:flex;gap:3px}.prog i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}.prog i.d{background:#5D687D}.prog i.n{background:var(--ink)}
.chap{flex:none;display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 8px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--info)}
.chap em{font-style:normal;letter-spacing:0;color:var(--muted);font-weight:500}

/* stage: fixed height, never moves */
.stage{flex:none;height:clamp(200px,33dvh,290px);border:1px solid var(--line);border-radius:14px;background:#0D1119;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.stage.in svg{animation:fin .35s ease}@keyframes fin{from{opacity:0}to{opacity:1}}

/* caption: fixed region, scrolls inside */
.cap{flex:1;min-height:0;overflow-y:auto;padding:14px 2px 6px;scrollbar-width:none}.cap::-webkit-scrollbar{display:none}
.cap h1{font-size:22px;line-height:1.2;letter-spacing:-.015em;margin:0 0 6px;font-weight:700}
.cap p.intro{font-size:15px;line-height:1.45;color:var(--text);margin:0 0 12px}
.cap p.intro b{color:var(--ink);font-weight:600}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.steps li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.4}
.steps li .n{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font:600 11px var(--mono);background:#1A2130;color:var(--muted);margin-top:0}
.steps li.a .n{background:#3A1C20;color:#F08A8D}
.steps li.r .n{background:#17233A;color:var(--info)}
.steps li.cur{color:var(--ink)}
.steps li .tag{flex:none;min-width:94px;height:20px;padding:0 6px;border-radius:6px;display:grid;place-items:center;font:600 10px var(--body);letter-spacing:.06em;background:#1A2130;color:var(--text)}
.steps li.a .tag{background:#3A1C20;color:#F08A8D}.steps li.w .tag{background:#33281A;color:var(--warn)}.steps li.g .tag{background:#123222;color:var(--ok)}
.steps li .t small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.steps li .t b{font-weight:600}
.take{margin:12px 0 0;font-size:15px;line-height:1.45;color:var(--ink);font-weight:600}
.take span{color:var(--muted);font-weight:400}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:4px}.pick button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px}
.pick b{display:block;font-size:15px;font-weight:600;color:var(--ink)}.pick small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}.pick em{font-style:normal;margin-left:auto;color:var(--muted);font-size:18px}
.wn rect{fill:#0F141E;stroke:#1E2633}.wn.on rect{fill:#121823;stroke:#2C3546}.wnn{font:700 30px var(--body);fill:var(--dim);letter-spacing:-.02em}.wn.on .wnn{fill:var(--ink)}.wnt{font:500 10.5px var(--body);fill:var(--text)}.wns{font:500 9px var(--body);fill:var(--muted)}.wns.b{font-weight:600;fill:#9AA4B6}
.pk rect{fill:#10151F;stroke:#2C3546}.ph{font:600 11px var(--body);letter-spacing:.1em;fill:var(--info)}.pd{font:600 13.5px var(--body);fill:var(--ink)}.pw{font:500 11px var(--body);fill:var(--muted)}
.fl rect{fill:#121823;stroke:#2A3445}.fl text{font:600 12px var(--body);fill:var(--ink)}.fl.r rect{stroke:var(--info)}.fl.a rect{stroke:var(--warn)}.fl.b rect{stroke:var(--ok)}.flar{stroke:var(--muted);stroke-width:1.4}
.fls{font:500 9.5px var(--body);fill:var(--muted)}
.flsub{font:500 11px var(--body);fill:var(--muted)}.ch2 rect{fill:#0F1F17;stroke:#1F4A33}.ch2 text{font:600 11px var(--mono);fill:var(--ok)}
.jr rect{fill:#0F141E;stroke:#1E2633}.jh{font:600 9.5px var(--body);letter-spacing:.12em}.jr.a .jh{fill:#F08A8D}.jr.r .jh{fill:var(--info)}.jr.g .jh{fill:var(--ok)}.jr.g>rect{stroke:#1F4A33}
.jc rect{fill:#151B27;stroke:#2C3546}.jc text{font:600 9px var(--mono);fill:var(--text)}.jt{font:500 11.5px var(--body);fill:var(--ink)}.jc.b0 rect{fill:#22151A;stroke:#6B2C32}.jc.b0 text{fill:#F08A8D}.jc.r0 rect{fill:#17233A;stroke:#34507F}.jc.r0 text{fill:var(--info)}.jr.g .jc rect{fill:#0F1F17;stroke:#2B6B48}.jr.g .jc text{fill:var(--ok)}
.jh2{font:600 9px var(--body);letter-spacing:.12em;fill:var(--muted)}.dec1 rect{fill:#0F1F17;stroke:#2B6B48;stroke-width:1.4}.d1{font:700 12px var(--body);fill:var(--ink)}.d2{font:500 10px var(--mono);fill:var(--ok)}.jres{font:500 10.5px var(--body);fill:var(--muted)}.jc.g0 rect{fill:#0F1F17;stroke:#2B6B48}.jc.g0 text{fill:var(--ok)}
.diff{margin-top:12px;border-top:1px solid var(--line)}.diff div{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--muted)}.diff b{color:var(--ok);font-weight:600}
.srcs{margin:10px 0 0;font-size:12.5px;color:var(--muted)}.srcs a{color:var(--info);text-decoration:none}
.srcl{display:inline-block;margin-top:8px;font-size:13px;color:var(--info);text-decoration:none}

/* bottom bar */
.bar{flex:none;display:flex;gap:8px;padding-top:10px}
.bar button{height:50px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:15.5px}
.bar .nav{width:52px;font-size:20px;color:var(--text)}.bar .nav:disabled{opacity:.3}
.bar .act{flex:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar .act.done{background:transparent;color:var(--muted);border-color:var(--line)}
.bar .nav.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode{flex:none;height:8px;display:flex;justify-content:center;align-items:flex-end;font:500 12px var(--body);color:var(--muted)}
.mode button{background:none;border:0;color:var(--info);font-weight:600;padding:0}

/* svg */
.nd .bg{fill:#121823;stroke:#2C3546;stroke-width:1}
.nd text{font:600 12.5px var(--body);fill:var(--text)}.nd .sub{font:500 10.5px var(--body);fill:var(--muted)}
.nd .gl{fill:none;stroke:#8C98AE;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.nd.att .bg{fill:#22151A;stroke:#6B2C32}.nd.att .gl{stroke:#F08A8D}
.nd.dim{opacity:.4}
.pod{fill:#111723;stroke:#2C3546;stroke-dasharray:4 4}
.podl{font:600 9.5px var(--body);letter-spacing:.1em;fill:var(--muted)}
.core .bg{fill:#151B27;stroke:var(--warn);stroke-width:1.5}.core .gl{fill:none;stroke:var(--warn);stroke-width:1.4;stroke-linejoin:round}
.e{fill:none;stroke-width:1.6;stroke-linecap:round}
.e.a{stroke:var(--bad)}.e.r{stroke:var(--info)}.e.ok{stroke:var(--ok)}.e.x{stroke:#3A4558;stroke-dasharray:3 4}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.nb circle{fill:#0D1119;stroke:#3A4558}.nb text{font:600 10px var(--mono);fill:var(--text)}
.nb.a circle{stroke:#8A3238}.nb.a text{fill:#F08A8D}
.chip rect{fill:#22151A;stroke:#6B2C32}.chip text{font:600 10.5px var(--mono);fill:#F08A8D}
.foot{font:600 9.5px var(--body);letter-spacing:.1em;fill:#8A4A50}
.fadein{animation:fin .4s ease}
.pod.on{stroke:#2B6B48;stroke-dasharray:none}.foot.ok{fill:#3E8E64}
.xm circle{fill:#0A0D14;stroke:var(--ok);stroke-width:1.4}.xm path{stroke:var(--ok);stroke-width:1.6;stroke-linecap:round}
.eng-l{font:600 9.5px var(--body);fill:var(--ok);letter-spacing:.02em}.eng-l.y{fill:var(--warn)}
.chip.blk rect{fill:#0F1F17;stroke:#2B6B48}.chip.blk text{fill:#6FA98A;text-decoration:line-through}.chip.runs rect{fill:#2A2213;stroke:#6B5223}.chip.runs text{fill:var(--warn)}
.steps li.r .tag{background:#17233A;color:var(--info)}.steps li.b .n,.steps li.b .tag{background:#123222;color:var(--ok)}.steps li.y .tag{background:#33281A;color:var(--warn)}
.st rect{fill:#0F141E;stroke:#1E2633}.st.on rect{fill:#0F1F17;stroke:#2B6B48}.st text{font:600 10.5px var(--body);fill:var(--dim)}.st.on text{fill:var(--ok)}
.hlr{fill:none;stroke:var(--warn);stroke-width:1.2}.hl-net line,.hl-net circle{animation:fin .5s ease}.bap .frame.done{stroke:#2B6B48}.bap .pt.g{fill:var(--ok)}
.bap .frame{fill:#0F141E;stroke:#1E2633}.bap .h{font:600 10px var(--body);letter-spacing:.12em;fill:var(--muted)}.bap .pt{font:600 10px var(--mono);fill:#F08A8D}.bap .cnt{font:500 10px var(--body);fill:var(--muted)}
.ba .h{font:600 9.5px var(--body);letter-spacing:.1em;fill:var(--muted)}.ba .n{font:600 12px var(--body);fill:var(--text)}.ba .b{font:500 11.5px var(--mono);fill:#C06A6E}.ba .a{font:600 11.5px var(--mono);fill:var(--ok)}.ba rect{fill:#0F141E}
.e.al{stroke:#5C6880}.e.ex{stroke:var(--bad);stroke-dasharray:3 4;opacity:.8}
.pc rect{fill:#151B27;stroke:#2C3546}.pc text{font:600 11px var(--mono);fill:var(--text)}
.pc.ok rect{fill:#123222;stroke:#2B6B48}.pc.ok text{fill:var(--ok)}.pc.b rect{fill:#22151A;stroke:#6B2C32}.pc.b text{fill:#F08A8D;text-decoration:line-through}
.rowl{font:600 8.5px var(--body);letter-spacing:.1em;fill:var(--muted)}
.eng rect{fill:#121823;stroke:#2C3546}.eng .en{font:600 13px var(--body);fill:var(--ink)}.eng .es{font:500 10.5px var(--body);fill:var(--muted)}.eng .z{font:600 11px var(--mono);fill:#F08A8D}
.src rect{fill:#0F141E;stroke:#1E2633}.src text{font:600 11.5px var(--body);fill:var(--dim)}.src .ss{font:500 9.5px var(--body)}.src.on rect{fill:#17233A;stroke:#34507F}.src.on text{fill:var(--info)}.src.on .ss{fill:var(--muted)}
.prof rect.card{fill:#111723;stroke:#2C3546}.prof .h{font:600 12px var(--body);fill:var(--ink)}.prof .rl{font:600 8.5px var(--body);letter-spacing:.1em;fill:var(--muted)}.prof .rv{font:600 10.5px var(--mono);fill:var(--dim)}.prof .rv.on{fill:var(--ok)}
.flow{stroke:#2C3546;stroke-width:1.3;fill:none}.flow.on{stroke:#34507F}
.flag rect{fill:#2A1418;stroke:#6B2C32}.flag text{font:600 9.5px var(--body);letter-spacing:.06em;fill:#F08A8D}
.pc.w rect{fill:#2A2213;stroke:#6B5223}.pc.w text{fill:var(--warn)}
.rp .row rect{fill:#0F141E}.rp text{font:500 11px var(--mono);fill:var(--dim)}.rp .row.on text{fill:var(--text)}.rp .ok{fill:var(--ok)!important}.rp .bad{fill:#F08A8D!important}.rp .muted{fill:var(--muted)!important}
.rp .row.rev{opacity:0;animation:fin .3s ease forwards}.rp .res rect{fill:#0F141E;stroke:#1E2633}.rp .res.pass rect{fill:#0F1F17;stroke:#2B6B48}.rp .res.fail rect{fill:#22151A;stroke:#6B2C32}.rp .res text{font:600 12px var(--body)}
.why rect{fill:#0F141E;stroke:#1E2633;transition:fill .3s,stroke .3s}.why text{font:600 12px var(--body);fill:var(--dim)}.why.on rect{fill:#2A2213;stroke:#6B5223}.why.on text{fill:var(--warn)}

/* cover */
.cover{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;padding:28px 22px calc(18px + env(safe-area-inset-bottom))}.cover[hidden]{display:none}
.cover .k{font:600 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--info)}
.cover h1{font-size:31px;line-height:1.12;letter-spacing:-.02em;margin:12px 0 12px;font-weight:700}
.cover .msg{font-size:16px;line-height:1.5;color:var(--text);margin:0}
.cover .vis{flex:1;min-height:150px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;margin:10px 0 12px}
.cover .vis svg{width:100%;flex:1;min-height:0;max-height:300px}
.cvcap{position:relative;height:20px;margin-top:6px;text-align:center;font:500 13px var(--body);color:var(--text)}.cvcap span{position:absolute;left:0;right:0;opacity:0}
.cc1{animation:capio 2.4s ease forwards}.cc2{animation:capio 4.2s ease 2.4s forwards}.cc3{animation:fin .6s ease 6.9s forwards;color:var(--ok)}
@keyframes capio{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}
.cover .btns{display:flex;flex-direction:column;gap:9px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .5s ease,transform .5s ease}.cover .btns.on{opacity:1;transform:none;pointer-events:auto}
.cover .btns button{height:54px;border-radius:13px;font-weight:600;font-size:16px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px}
.cover .btns button.sec{background:transparent;border-color:var(--line);color:var(--ink)}
.cover .btns small{font-weight:500;font-size:13px;opacity:.6}
.cover .ft{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
.lg{font:500 10.5px var(--body);fill:var(--muted)}
.cv-out{animation:cvo .45s ease forwards}
.cl-frame{fill:none;stroke:#2C3546;stroke-dasharray:4 4}.cl-l{font:600 8.5px var(--body);letter-spacing:.1em;fill:var(--muted)}.cl-e{stroke:#E5484D;stroke-width:1;opacity:.5}.cl-p{fill:#151B27;stroke:#4A5468}.cl-p.t{stroke:var(--warn);stroke-width:1.5}
.cv-zoom{transform-box:view-box;animation:cvz .9s cubic-bezier(.4,0,.2,1) 1.68s forwards}@keyframes cvz{to{transform:scale(4);opacity:0}}
.cv-inner{opacity:0;transform-box:view-box;animation:fin .5s ease 2.2s forwards,cvzo .8s cubic-bezier(.4,0,.2,1) 6.4s forwards}@keyframes cvzo{from{opacity:1;transform:none}to{opacity:0;transform:scale(.25)}}
.cv-final{opacity:0;animation:fin .6s ease 6.8s forwards}.cl-x{stroke:#2C3546;stroke-width:1;stroke-dasharray:3 4}.cl-g{stroke:var(--ok);stroke-width:1.4}.cl-p.g{stroke:#2B6B48}
.cv-out2{animation:cvo .3s ease forwards}.cv-in2{opacity:0;animation:fin .35s ease forwards}
.cv-row{fill:none;stroke:var(--warn);stroke-width:1;opacity:0;animation:rowf 1.3s ease forwards}@keyframes rowf{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
.cv-h{font:600 8.5px var(--body);letter-spacing:.12em;fill:var(--muted)}.cv-k{font:600 8.5px var(--body);letter-spacing:.08em;fill:var(--muted)}.cv-b{font:600 10.5px var(--mono);fill:#F08A8D}.cv-a{font:600 10.5px var(--mono);fill:var(--ok)}.cv-in{opacity:0;animation:fin .45s ease forwards}@keyframes cvo{to{opacity:0}}

/* chapter screen */
.inter{position:absolute;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;padding:28px 22px calc(18px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .3s}
.inter.on{opacity:1;pointer-events:auto}
.inter .ik{font:600 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--info);margin-top:auto}
.inter h2{font-size:24px;line-height:1.25;letter-spacing:-.01em;margin:10px 0 26px;font-weight:700}
.inter h2 span{color:var(--muted);font-weight:500}
.road{list-style:none;margin:0 0 auto;padding:0}
.road li{position:relative;padding:0 0 20px 36px;color:var(--dim)}
.road li::before{content:'';position:absolute;left:11px;top:26px;bottom:2px;width:1.5px;background:var(--line)}
.road li:last-child::before{display:none}
.road .dot{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font:600 11px var(--mono)}
.road li.d .dot{border-color:var(--ok);color:var(--ok)}.road li.d::before{background:#2B6B48}
.road li.n .dot{border-color:var(--ink);color:var(--ink)}
.road b{display:block;font-size:16.5px;line-height:23px;font-weight:600}
.road li.n b{color:var(--ink)}.road li.d b{color:var(--text)}
.road small{display:block;font-size:13px;margin-top:2px}
.road li.n small{color:var(--text)}
.inter .go{height:54px;border-radius:13px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;margin-top:22px}

@media (max-height:700px){.cap h1{font-size:19.5px}.cap p.intro{font-size:14px;margin-bottom:9px}.steps li{padding:7px 0;font-size:13.5px}.bar button{height:46px}.cover h1{font-size:27px}.cover .msg{font-size:15px}.inter h2{font-size:21px;margin-bottom:18px}.road li{padding-bottom:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.cv-final,.cc3{opacity:1}.cv-out,.cv-zoom,.cv-inner,.cc1,.cc2{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 24 24"><path d="M12 2.5 4 5.8v5.6c0 4.8 3.3 8.8 8 10.1 4.7-1.3 8-5.3 8-10.1V5.8z" fill="none" stroke="#7AA2F7" stroke-width="1.6"/><path d="m8.5 12 2.4 2.4 4.6-4.8" fill="none" stroke="#4CC38A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Safety Layer</div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="chap" id="chap"></div>
  <div class="stage" id="stage"><svg id="map" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="cap" id="cap"></div>
  <div class="bar"><button class="nav" id="back" aria-label="Back">‹</button><button class="act" id="act"></button><button class="nav" id="next" aria-label="Next">›</button></div>
  <div class="mode" id="mode"></div>

  <section class="inter" id="inter"><div class="ik" id="interK"></div><h2 id="interH"></h2><ol class="road" id="road"></ol><button class="go" id="interGo">Continue</button></section>

  <section class="cover" id="cover">
    <div class="k">Safety Layer</div>
    <h1>Zero Trust inside the cluster. Decided for you.</h1>
    <p class="msg">Every workload gets only what it needs. We decide the rules from evidence, and prove them before they apply.</p>
    <div class="vis"><svg id="coverVis" viewBox="0 0 360 210" preserveAspectRatio="xMidYMid meet"></svg><div class="cvcap" id="cvcap"></div></div>
    <div class="btns" id="coverBtns"><button id="explore">Start the tour <small>step by step · about 3 min</small></button></div>
    <div class="ft">Kubernetes · Cilium · Tetragon</div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers=[]; const later=(ms,f)=>timers.push(setTimeout(f,reduce?Math.min(ms,60):ms)); const stop=()=>{ timers.forEach(clearTimeout); timers=[]; };

// ---------- drawing helpers
function glyph(t,x,y){ const g=d=>`<path class="gl" d="${d}"/>`;
  if(t==='net') return `<circle class="gl" cx="${x}" cy="${y}" r="7"/><ellipse class="gl" cx="${x}" cy="${y}" rx="3.2" ry="7"/>`+g(`M${x-7} ${y}H${x+7}`);
  if(t==='api') return `<circle class="gl" cx="${x}" cy="${y}" r="6.5"/><circle class="gl" cx="${x}" cy="${y}" r="2"/>`+[0,60,120,180,240,300].map(a=>{ const r=a*Math.PI/180; return g(`M${x+Math.cos(r)*2.5} ${y+Math.sin(r)*2.5}L${x+Math.cos(r)*8.5} ${y+Math.sin(r)*8.5}`); }).join('');
  if(t==='db') return `<ellipse class="gl" cx="${x}" cy="${y-5}" rx="7" ry="2.6"/>`+g(`M${x-7} ${y-5}V${y+5}A7 2.6 0 0 0 ${x+7} ${y+5}V${y-5}`)+g(`M${x-7} ${y}A7 2.6 0 0 0 ${x+7} ${y}`);
  if(t==='ai') return g(`M${x} ${y-7}L${x+2} ${y-2}L${x+7} ${y}L${x+2} ${y+2}L${x} ${y+7}L${x-2} ${y+2}L${x-7} ${y}L${x-2} ${y-2}Z`);
  if(t==='pkg') return g(`M${x} ${y-7}L${x+6.5} ${y-3.5}V${y+3.5}L${x} ${y+7}L${x-6.5} ${y+3.5}V${y-3.5}Z`)+g(`M${x-6.5} ${y-3.5}L${x} ${y}L${x+6.5} ${y-3.5}M${x} ${y}V${y+7}`);
  if(t==='doc') return `<rect class="gl" x="${x-5.5}" y="${y-7}" width="11" height="14" rx="1.5"/>`+g(`M${x-3} ${y-3}H${x+3}M${x-3} ${y}H${x+3}M${x-3} ${y+3}H${x+1}`);
  if(t==='key') return `<circle class="gl" cx="${x-3}" cy="${y}" r="3.5"/>`+g(`M${x+.5} ${y}H${x+7.5}M${x+5} ${y}V${y+3}`);
  return ''; }
function node(x,y,label,sub,ic,cls=''){ return `<g class="nd ${cls}"><rect class="bg" x="${x-15}" y="${y-15}" width="30" height="30" rx="8"/>${glyph(ic,x,y)}<text x="${x}" y="${y+29}" text-anchor="middle">${label}</text>${sub?`<text x="${x}" y="${y+42}" text-anchor="middle" class="sub">${sub}</text>`:''}</g>`; }
function exitRect(x1,y1,x2,y2,R){ const [rx,ry,rw,rh]=R; let tmin=1; const tryT=t=>{ if(t>0&&t<tmin){ const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t; if(x>=rx-.1&&x<=rx+rw+.1&&y>=ry-.1&&y<=ry+rh+.1) tmin=t; } };
  if(x2!==x1){ tryT((rx-x1)/(x2-x1)); tryT((rx+rw-x1)/(x2-x1)); } if(y2!==y1){ tryT((ry-y1)/(y2-y1)); tryT((ry+rh-y1)/(y2-y1)); } return [x1+(x2-x1)*tmin,y1+(y2-y1)*tmin]; }
function trim(a,b,r1=19,r2=19){ const [x1,y1]=a,[x2,y2]=b,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L; return [x1+ux*r1,y1+uy*r1,x2-ux*r2,y2-uy*r2]; }
const DEFS=`<defs>${[['a','#E5484D'],['r','#7AA2F7'],['ok','#4CC38A']].map(([c,f])=>`<marker id="m-${c}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${f}"/></marker>`).join('')}</defs>`;
const badge=(x,y,n,c)=>`<g class="nb ${c}"><circle cx="${x}" cy="${y}" r="8"/><text x="${x}" y="${y+3.5}" text-anchor="middle">${n}</text></g>`;
function line(a,b,c,fresh,n){ const [x1,y1,x2,y2]=trim(a,b); let s=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" pathLength="1" class="e ${c} ${fresh?'draw':''}" marker-end="url(#m-${c})"/>`;
  if(n) s+=`<g class="${fresh?'fadein':''}">${badge((x1+x2)/2,(y1+y2)/2,n,c)}</g>`; return s; }

  $('inter').classList.add('on'); const done=()=>{ stop(); $('inter').classList.remove('on'); go(); };
  $('interGo').onclick=done; if(watching) later(3200,done); }
function goTo(i){ const r=ROUTE.indexOf(i), prev=ROUTE[r-1]; if(prev==null||STEPS[prev].part!==STEPS[i].part) inter(i,()=>show(i)); else show(i); }
function choose(id){ SC=CASES[id]; SEEN.add(id); ROUTE=SEEN.size>1?SHORT:FULL; ST=STEPS.map(s=>s.init()); if(ROUTE===SHORT) goTo(1); else show(1); }
function autoplay(){ stop(); if(at===0){ later(2200,()=>{ if(watching) choose('c1'); }); return; }
  const tick=()=>{ if(!watching) return; const st=STEPS[at],s=ST[at]; if(!st.done(s)){ act(); later(2600,tick); } else later(3600,()=>{ if(watching&&nextOf()!=null) goTo(nextOf()); else { watching=false; render(); } }); }; later(1400,tick); }
$('act').onclick=()=>{ if(watching){ watching=false; stop(); } act(); };
$('next').onclick=()=>{ watching=false; stop(); if(at===0){ choose('c1'); return; } if(nextOf()!=null) goTo(nextOf()); };
$('back').onclick=()=>{ if(pos()>0){ watching=false; show(prevOf()); } };

// ---------- cover visual: the cluster, into one workload, every layer closes, back out to the whole cluster
let coverT=null;
function drawCover(){ let s=DEFS;
  const G=[]; for(let r=0;r<3;r++) for(let c=0;c<4;c++) G.push([60+c*80,42+r*62]);
  const T=5, tgt=G[T];
  const mesh=[]; for(let a=0;a<G.length;a++) for(let b=a+1;b<G.length;b++){ const [x1,y1]=G[a],[x2,y2]=G[b]; if(Math.hypot(x2-x1,y2-y1)<130) mesh.push([a,b]); }
  const pods=(cls)=>G.map(([x,y],i)=>`<rect x="${x-14}" y="${y-11}" width="28" height="22" rx="5" class="cl-p ${cls} ${i===T&&cls!=='g'?'t':''}"/>`).join('');
  // phase 1: everything reaches everything
  let cl=`<g class="cv-zoom" style="transform-origin:${tgt[0]}px ${tgt[1]}px"><rect x="14" y="8" width="332" height="194" rx="14" class="cl-frame"/>`;
  mesh.forEach(([a,b])=>{ cl+=`<line x1="${G[a][0]}" y1="${G[a][1]}" x2="${G[b][0]}" y2="${G[b][1]}" class="cl-e"/>`; });
  cl+=pods('')+`</g>`;
  // phase 2: inside one workload
  const P=[86,20,188,170], C=[180,105];
  let inn=`<g class="cv-inner" style="transform-origin:180px 105px">`;
  const ends=[[18,34,1],[18,105,1],[18,176,0],[342,34,0],[342,105,1],[342,176,0],[180,8,0],[180,202,1]];
  ends.forEach(([x,y,need])=>{ const [bx,by]=exitRect(C[0],C[1],x,y,P); const t=3.04;
    inn+=`<line x1="${bx}" y1="${by}" x2="${x}" y2="${y}" class="e a cv-out" style="animation-delay:${t}s"/><circle cx="${x}" cy="${y}" r="3.5" fill="#22151A" stroke="#E5484D" class="cv-out" style="animation-delay:${t}s"/>`;
    if(need) inn+=`<line x1="${bx}" y1="${by}" x2="${x}" y2="${y}" class="e ok cv-in" style="animation-delay:${t}s"/><circle cx="${x}" cy="${y}" r="4" fill="#123222" stroke="#4CC38A" class="cv-in" style="animation-delay:${t}s"/>`;
    else inn+=`<line x1="${bx}" y1="${by}" x2="${x}" y2="${y}" class="e x cv-in" style="animation-delay:${t}s"/><g class="cv-in" style="animation-delay:${t}s"><circle cx="${bx}" cy="${by}" r="5.5" fill="#0A0D14" stroke="#4CC38A"/><path d="M${bx-2.3} ${by-2.3}L${bx+2.3} ${by+2.3}M${bx+2.3} ${by-2.3}L${bx-2.3} ${by+2.3}" stroke="#4CC38A" stroke-width="1.3" stroke-linecap="round"/></g>`; });
  inn+=`<rect x="${P[0]}" y="${P[1]}" width="${P[2]}" height="${P[3]}" rx="12" fill="#111723" stroke="#4A5468"/><rect x="${P[0]}" y="${P[1]}" width="${P[2]}" height="${P[3]}" rx="12" fill="none" stroke="#2B6B48" stroke-width="1.5" class="cv-in" style="animation-delay:5.8s"/>`;
  inn+=`<text x="180" y="${P[1]+19}" text-anchor="middle" class="cv-h">ONE WORKLOAD</text>`;
  [['NETWORK','8 open','4 needed',3.04],['PROGRAMS','any binary','python',3.68],['FILES','any file','own files',4.24],['PRIVILEGES','root','none',4.8],['SYSCALLS','all','only used',5.3]].forEach(([l,b,a,t],r)=>{ const y=P[1]+44+r*24;
    inn+=`<rect x="${P[0]+6}" y="${y-14}" width="${P[2]-12}" height="20" rx="5" class="cv-row" style="animation-delay:${t}s"/>`;
    inn+=`<text x="${P[0]+14}" y="${y}" class="cv-k">${l}</text><text x="${P[0]+P[2]-14}" y="${y}" text-anchor="end" class="cv-b cv-out2" style="animation-delay:${t}s">${b}</text><text x="${P[0]+P[2]-14}" y="${y}" text-anchor="end" class="cv-a cv-in2" style="animation-delay:${t+0.3}s">${a}</text>`; });
  inn+=`</g>`;
  // phase 3: back out, the whole cluster
  const keep=[[0,1],[1,5],[5,6],[6,10],[2,3],[4,8],[9,10],[7,11]];
  let fin=`<g class="cv-final"><rect x="14" y="8" width="332" height="194" rx="14" class="cl-frame"/>`;
  mesh.forEach(([a,b])=>{ fin+=`<line x1="${G[a][0]}" y1="${G[a][1]}" x2="${G[b][0]}" y2="${G[b][1]}" class="cl-x"/>`; });
  keep.forEach(([a,b])=>{ fin+=`<line x1="${G[a][0]}" y1="${G[a][1]}" x2="${G[b][0]}" y2="${G[b][1]}" class="cl-g"/>`; });
  fin+=pods('g')+`</g>`;
  $('coverVis').innerHTML=s+cl+inn+fin;
  $('cvcap').innerHTML=`<span class="cc1">A cluster where everything can reach everything</span><span class="cc2">Inside one workload</span><span class="cc3">Only what it needs, on every layer</span>`;
  const btn=$('coverBtns'); btn.classList.remove('on'); clearTimeout(coverT); coverT=setTimeout(()=>btn.classList.add('on'),reduce?0:8400); }
$('cover').addEventListener('click',e=>{ if(!e.target.closest('button')) $('coverBtns').classList.add('on'); });
drawCover();

if($('watch')) $('watch').onclick=()=>{ $('cover').hidden=true; watching=true; SEEN.clear(); ROUTE=FULL; ST=STEPS.map(s=>s.init()); goTo(0); };
$('explore').onclick=()=>{ $('cover').hidden=true; watching=false; SEEN.clear(); ROUTE=FULL; ST=STEPS.map(s=>s.init()); goTo(0); };
render(true,false);
if(/skip/.test(location.search)) $('cover').hidden=true;
</script>
</body>
