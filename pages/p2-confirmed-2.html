<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision &amp; Safety Layer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Screens (decided 2026-10-19): general screens in the top menu - Cluster, Changes, Workloads, Policies, Activity - and
   detail one click in: Namespace -> Workload -> Change. One visual language: colour = needed (green needed, red not
   needed, amber to decide), line = allowed (solid allowed, dashed blocked). Every fact is read from the data. */
:root{--bg:#F3F5F8;--panel:#fff;--ink:#142030;--muted:#5B6878;--line:#E1E6ED;--soft:#F6F8FB;--navy:#1F3A93;
--allow:#0E7C66;--remove:#C62828;--review:#B8860B;--ext:#6B48B8;--shadow:0 1px 2px rgba(20,32,48,.05),0 1px 1px rgba(20,32,48,.03)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.5}
a{color:var(--navy)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;min-height:56px;background:var(--ink);color:#fff;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:#AEB9C7;padding:17px 10px;font-size:14px;text-decoration:none;white-space:nowrap}
.top nav a.on{color:#fff;box-shadow:inset 0 -3px 0 #7FA2FF}
.top nav a .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:5px;border-radius:9px;background:#C98A12;color:#fff;font-size:11.5px;font-weight:700;line-height:18px;text-align:center}
.fresh{font-size:13px;color:#AEB9C7}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 48px}
.crumbs{font-size:14px;color:var(--muted)}.crumbs a{text-decoration:none}
h1{margin:2px 0 0;font-size:28px;letter-spacing:-.025em;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
.small{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card h2{margin:0 0 10px;font-size:16px}
.cap{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.grid2>.card{margin-top:16px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:14px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs a{font-size:14.5px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;padding:8px 0;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--navy)}
.tabs span.off{font-size:14.5px;color:#A3ADBA;padding:8px 0;white-space:nowrap}
.btn{white-space:nowrap;font:inherit;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:#B9C3D0}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:#9B1C1C;border-color:#E9B0B0}.btn.danger.pri{background:#9B1C1C;border-color:#9B1C1C;color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tabs a:focus-visible,a:focus-visible{outline:3px solid #7FA2FF;outline-offset:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 16px;background:#FAFBFD;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid #EDF0F4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.go{cursor:pointer}.tbl tr.go:hover{background:#F7F9FC}
.tbl small{display:block;color:var(--muted);font-size:12.5px}
.code{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.btn.code{font-weight:500;font-size:12px;padding:6px 10px;background:var(--soft)}
.num{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600}
.num.zero{color:#A3ADBA;font-weight:400}
.tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.ladder .seg{height:8px;border-radius:4px;background:#E3E8EF}
.ladder .seg.on{background:var(--navy)}.ladder .seg.cur{box-shadow:0 0 0 3px #C9D4F2}
.ladder .seg.next{background:repeating-linear-gradient(90deg,#C98A12 0 6px,#FFE7A8 6px 10px)}
.ladder .lt{font-size:13px;margin-top:6px;line-height:1.35}.ladder .lt b{display:block}
.ladder .lt.dim{color:#8592A3}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:120px}.mini i{height:7px;border-radius:3px;background:#E3E8EF}.mini i.on{background:var(--navy)}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;font-size:14px}
.row small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.row .p{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap}
.row.btnrow{width:100%;text-align:left;font:inherit;font-size:14px;background:none;border:none;border-radius:8px;padding:6px;margin:0 -6px;cursor:pointer;color:var(--ink)}
.row.btnrow:hover{background:var(--soft)}.row.btnrow.on{background:#EEF3FF}
.ev{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid #EDF0F4;font-size:14px;align-items:baseline}
.ev:first-child{border-top:none}.ev i{width:8px;height:8px;border-radius:50%;display:block;margin-top:6px}
.ev small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:13px;flex:none}.stepn.ok{background:var(--allow)}
.sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.sh b{font-size:16px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi b{display:flex;align-items:center;gap:8px;font-size:22px;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:13px}
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px;box-shadow:var(--shadow)}
.mapbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg2 button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 12px;border:none;background:#fff;color:var(--muted);cursor:pointer}
.seg2 button.on{background:var(--ink);color:#fff}
.maps{display:grid;grid-template-columns:1fr}.maps.two{grid-template-columns:1fr 1fr}
.maps.two .pane+.pane{border-left:1px solid var(--line)}
.pane .pcap{padding:10px 16px 0;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
svg.map{display:block;width:100%;height:auto;user-select:none}
.legend{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:#FAFBFD}
.legend i{display:inline-block;width:22px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.node{cursor:pointer}.node:hover rect.box{stroke:var(--navy)}.node:focus{outline:none}.node:focus-visible rect.box{stroke:var(--navy);stroke-width:2.5}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
select.pick{font:inherit;font-size:14px;padding:6px 30px 6px 10px;border:1px solid var(--line);border-radius:7px;background:#fff}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(20,32,48,.12);display:flex;flex-direction:column;z-index:10}
#drawer[hidden]{display:none}
#drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#drawer pre{margin:0;padding:16px 18px;overflow:auto;flex:1;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.55;background:#FAFBFD}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
/* 2026-10-20 (ui-next): callouts, the switcher in a title, what needs you, folded quiet rows */
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13.5px;line-height:1.45}
.callout.warn{background:#FFF8E6;border:1px solid #EFD7A1;color:#5C3D00}.callout.info{background:#F1F5FE;border:1px solid #CBD7F4;color:#1B2E6E}
.callout.ok{background:#EEF8F4;border:1px solid #BFE3D6;color:#0B4F42}.callout b{font-weight:700}
.nsw{position:relative;display:inline-block}.nsw>summary{list-style:none;display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:inherit;font-size:inherit}
.nsw>summary::-webkit-details-marker{display:none}.nsw>summary .caret{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:2px 8px;background:#fff}
.nsw>summary:hover .caret{border-color:#B9C3D0;color:var(--ink)}
.nsw .menu{position:absolute;z-index:6;top:calc(100% + 6px);left:0;min-width:280px;max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(20,32,48,.16);padding:6px}
.nsw .menu input{width:100%;font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px}
.nsw .menu a{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.nsw .menu a:hover,.nsw .menu a.on{background:var(--soft)}.nsw .menu a small{color:var(--muted);font-size:12px}
.needs{display:flex;flex-direction:column;gap:2px}.needs a{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 8px;margin:0 -8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:14px}
.needs a:hover{background:var(--soft)}.needs a small{display:block;color:var(--muted);font-size:12.5px}.needs .ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.quiet summary{padding:12px 20px;font-size:13.5px}.quiet[open] summary{border-bottom:1px solid #EDF0F4}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}.links a{text-decoration:none;font-weight:600}
.nslist{display:none}.nslist a{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-left:5px solid;border-radius:12px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow)}
.nslist a b{font-size:17px}.nslist a .small{display:block;margin-top:2px}
@media (max-width:720px){.cmapw{display:none}.nslist{display:block}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.maps.two{grid-template-columns:1fr}.maps.two .pane+.pane{border-left:none;border-top:1px solid var(--line)}}
@media (max-width:720px){.top{padding:6px 12px}.top nav a{padding:8px 7px}.fresh{display:none}.wrap{padding:12px 12px 32px}h1{font-size:22px}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}}
.ptiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.ptile{border:1px solid var(--line);border-top:4px solid;border-radius:10px;padding:10px 12px;background:#fff}.ptile b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.ptile span{display:block;font-weight:600;font-size:14px}.ptile small{display:block;color:var(--muted);font-size:12.5px}
@media (max-width:560px){.ptiles{gap:6px}.ptile{padding:8px}.ptile b{font-size:22px}.ptile span{font-size:12.5px}.ptile small{display:none}}
.pgroup{margin-top:10px}.pgh{border-left:4px solid;padding:2px 0 2px 10px;margin-bottom:4px}.pgh b{font-size:14px}.pgh small{display:block;color:var(--muted);font-size:12.5px}
.pgroup>summary{list-style:none;cursor:pointer}.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary b::after{content:' ▸';color:var(--muted)}.pgroup[open]>summary b::after{content:' ▾'}
.ptree-list{display:none}.tl{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;border-top:1px solid #F0F2F5}.tl small{color:var(--muted);font-size:12px;margin-left:auto}
.tlb{width:5px;height:18px;border-radius:3px;flex:none}.tlr{font-weight:700;color:#1F3A93;border-top:none;padding-top:10px}.tlr.bad{color:#9B1C1C}.tlr small{margin-left:8px}
.linkbtn{font:inherit;font-weight:600;color:#1F3A93;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.pfold:focus{outline:none}.pfold:focus rect:first-child{stroke-width:2.6}
@media (max-width:640px){.ptree-list{display:block}.ptree-pic{display:none}}
.pbtn{display:flex;gap:6px;align-self:center}.pbtn .btn{padding:5px 10px;font-size:13px}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0 7px 4px;border-top:1px solid #EDF0F4}.prow svg{margin-top:6px}
.prow small{display:block;color:var(--muted);font-size:12.5px}.prow.bad{background:#FFF7F7}
/* ---- stages (2026-10-20): one route per namespace - network stations navy, program stations violet */
#app.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lead{max-width:68ch;font-size:15.5px;color:#3D4855;margin-top:6px}
.known{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font-size:13.5px;color:#3D4855}.known b{font-size:15px}
.evid{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:16px;padding:14px 18px;border:1px solid #F0C2C2;border-radius:12px;background:#FFF8F8}
.evd{width:10px;height:10px;border-radius:50%;background:var(--remove)}
.nsroutes{display:grid;gap:14px;margin-top:20px}
.nsr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.nsr-h{display:flex;align-items:baseline;gap:12px}.nsr-n{font-size:20px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.015em}.nsr-n:hover{text-decoration:underline}
.nsr-next{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #EDF0F4}
.nsr-t{font-size:17px;font-weight:700;letter-spacing:-.01em}
.route{display:flex;align-items:center;margin-top:12px;max-width:560px}
.route .seg{flex:1;height:4px;background:#E3E8EF;border-radius:2px}.route .seg.on{background:var(--c)}
.stop{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--c);color:var(--c);background:#fff;font-style:normal}
.stop.done{background:var(--c);color:#fff}
.stop.next{background:#FFF6D6;border-color:#B8860B;color:#6B4500}
.stop.pre{border-style:dashed}
.stop.later{border-color:#C9D1DB;color:#8A96A6}
.route .stop.cur{box-shadow:0 0 0 4px rgba(184,134,11,.18)}
.links .route{margin-top:0;width:300px}.links .stop{width:20px;height:20px;font-size:10.5px}
.plan{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.rail{position:sticky;top:12px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.station{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px;padding:10px 10px 14px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px;line-height:1.3}
.station:not(:last-child)::after{content:'';position:absolute;left:22px;top:38px;bottom:-4px;width:2px;background:#E3E8EF}
.station.done:not(:last-child)::after{background:var(--c)}
.station small{display:block;font-weight:500;font-size:12px;color:var(--muted)}.station span>small:first-child{font-weight:600;margin-bottom:1px}
.station:hover{background:var(--soft)}.station.sel{background:#EEF2FB}
.station:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.detail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;min-height:420px}
.dt,.card h2.dt{font-size:24px;letter-spacing:-.02em;margin:2px 0 4px}
.lead2{font-size:15px;max-width:72ch;margin:16px 0 4px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.facts>div{border-left:3px solid #C9D3E3;padding:2px 0 2px 12px}
.facts b{display:block;font-size:15px}.facts span{font-size:13px;color:var(--muted)}
.qh{font-size:14.5px;margin:22px 0 4px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #EDF0F4;font-size:14px}.qrow small{display:block;color:var(--muted);font-size:12.5px}
.qgrp{margin-top:10px}.qgh{font-size:14px;padding:8px 0 4px}.qgh small{display:block;color:var(--muted);font-size:12.5px}
.delta{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}.delta>div{display:flex;flex-direction:column}.delta .n{font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.delta span{font-size:13px;color:var(--muted)}
.chipcode{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:2px 0}
.rtabs{margin:0 0 14px}
.expo-sum{display:grid;gap:4px;margin-top:18px;max-width:520px}
.expo-sum>div:first-child{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.expo-sum b{font-size:40px;letter-spacing:-.02em;color:var(--allow);font-variant-numeric:tabular-nums}
.expo-sum span{font-weight:600;font-size:15px}.expo-sum small{color:var(--muted);font-size:13px;width:100%}
.expo td,.expo th{vertical-align:top}.expo th a{color:var(--ink);font-size:15px}.expo th small{display:block;font-weight:500;color:var(--muted)}
.expo .cell{display:block;text-decoration:none;color:var(--ink);padding:2px 0;border-radius:8px}.expo .cell small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.expo .cell:hover small{color:var(--ink)}
.h2s{font-size:17px;margin:26px 0 0}
.nextrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid #EDF0F4;text-decoration:none;color:var(--ink)}
.nextrow:first-child{border-top:0}.nextrow:hover{background:var(--soft)}.nr-ns{font-weight:700;font-size:15px}.nextrow small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
@media (max-width:700px){.nextrow{grid-template-columns:1fr}}
.overview{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.ov{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.ov b{font-size:30px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}.ov b em{font-style:normal;font-size:18px;color:var(--muted);font-weight:600}
.ov span{font-weight:600;font-size:14px}.ov small{color:var(--muted);font-size:12.5px}.ov.big b{font-size:40px;color:var(--allow)}
.gbar{height:8px;border-radius:4px;background:#E3E8EF;overflow:hidden;margin:6px 0 2px}.gbar i{display:block;height:100%;background:var(--allow);border-radius:4px}

  const rows=nsPrograms(ns), need=rows.filter(r=>PSTATE[r.state]&&PSTATE[r.state][0]==='yes'||r.ans&&r.ans.needed), stop=rows.filter(r=>r.state==='Anomaly'&&!(r.ans&&r.ans.needed)||r.ans&&!r.ans.needed), open=progQuestions(ns).length;
  const progs=[...new Set(need.map(r=>r.program))];
  if(s.r===1) return head+`<div class="delta"><div><b class="n" style="color:var(--allow)">${progs.length}</b><span>programs allowed</span></div><div><b class="n" style="color:var(--remove)">${stop.length}</b><span>would have been blocked</span></div><div><b class="n" style="color:var(--review)">${open}</b><span>to confirm first</span></div></div>
      ${open?`<h3 class="qh">Confirm first · ${open}</h3><div class="small">Programs that ran but are not in their configuration. Your answer decides whether this stage allows them.</div>${qProg(ns)}`:''}
      ${stop.length?`<h3 class="qh">Would have been blocked</h3>${stop.map(r=>`<div class="qrow"><div><span class="code">${esc(base(r.program))}</span> in ${esc(r.w)}<small>${r.outside?'run by someone from outside the container':'not needed'}${r.ans?` · decided by ${esc(r.ans.by)}`:''}</small></div></div>`).join('')}`:''}
      ${(o=>o.length?`<div class="callout warn"><b>!</b><span><b>Not covered by this stage:</b> the shell opened from outside (${o.map(r=>`<span class="code">${esc(base(r.program))}</span> in ${esc(r.w)}`).join(', ')}). The app uses the same program, so it stays allowed. Blocking a program because of who started it needs a separate rule.</span></div>`:'')(rows.filter(r=>r.outside>0&&!stop.includes(r)))}
      <h3 class="qh">Allowed</h3><div class="small">${progs.map(p=>`<span class="code chipcode">${esc(base(p))}</span>`).join(' ')}</div>
      <div class="callout info"><b>i</b><span>Preview: this stage is not built yet. When it is, it starts in watch mode. Nothing is blocked; we record what would have been.</span></div>`;
  if(s.r===2){ const per={}; for(const r of need) (per[`${r.w} · ${r.container}`]=per[`${r.w} · ${r.container}`]||new Set()).add(r.program);
    return head+`<div class="delta"><div><b class="n">${Object.keys(per).length}</b><span>containers, each with its own list</span></div><div><b class="n" style="color:var(--allow)">${Math.max(0,...Object.values(per).map(x=>x.size))}</b><span>the most programs one container needs</span></div></div>
      <div class="callout info"><b>i</b><span>Preview: this stage is not built yet.</span></div>`; }
  return head+`<div class="callout info"><b>i</b><span>Preview: comes after the program stages. We will learn where each program writes, from its configuration and from watching it.</span></div>`;
}
// ---------- decisions (ui/decisions_api.py, behind the login): Approve and Roll back change the cluster
function sentBox(ns){ const s=SENT[ns]; if(!s||s.ok) return ''; if(s.pending) return `<div class="card" style="border-color:#B9C7EE">Working…</div>`;
  return `<div class="card" style="border-color:#F0B4B4;background:#FFF7F7"><b>Not recorded</b><div class="small">${esc(s.message||'')}</div></div>`; }
function friendly(ns,b,j){        // the toast in plain words; the record keeps the full message
  const st=(nextOf(ns)||nowOf(ns)), n=b.items?b.items.length:1;
  return b.kind==='approve'?`${levelLabel(nowOf(ns))} is now in force in ${ns}.`:b.kind==='rollback'?`${ns} is back to ${levelLabel(nowOf(ns)).toLowerCase()}.`
    :b.kind==='check'?(/^checks passed/.test(j.message)?'Nothing needed would be blocked. You can approve.':'Something needed would be blocked. See what below.')
    :b.kind==='programs'?`${plural(n,'program')} marked ${b.needed?'needed':'not needed'}.`:b.kind==='program'?`${base(b.program)} marked ${b.needed?'needed':'not needed'}.`
    :b.kind==='answer'?`Saved: ${b.workload.split('/').pop()} to ${peerName(b.to)} is ${b.needed?'needed':'not needed'}.`:b.kind==='reject'?'Rejected. Nothing changed in the cluster.':j.message; }
async function sendDecision(ns,body){
  SENT[ns]={pending:true}; render(); toast({working:true,message:'Working… this can take up to a minute'});
  try{ const r=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ns,...body})});
    const j=await r.json().catch(()=>({ok:false,message:`no answer from the decisions API (${r.status})`}));
    if(j.ok&&j.page){ DATA=j.page.data; META=j.page.meta; YAML=j.page.yaml; for(const k in LAY) delete LAY[k]; }
    if(j.ok) j.say=friendly(ns,body,j); SENT[ns]=j; toast(j); if(j.ok&&/^(approved|rolled back) /.test(j.message||'')) ROUTE=`#/ns/${ns}`; }
  catch(e){ SENT[ns]={ok:false,message:'No answer came back (the connection dropped). Refresh to see whether it was recorded.'}; toast(SENT[ns]); }
  render();
}
function toast(j){
  let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  const base='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;max-width:min(680px,calc(100% - 32px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(20,32,48,.22);color:#fff;';
  if(j.working){ el.innerHTML=`<b>Working…</b><span>${esc(j.message)}</span>`; el.style.cssText=base+'background:#1F3A93'; clearTimeout(el._t); return; }
  const ok=!!j.ok, what=j.message||'Not recorded', head=!ok?'Not recorded':/^approved /.test(what)?'✓ Approved':/^rejected /.test(what)?'✓ Rejected':/^rolled back /.test(what)?'✓ Rolled back':/^checks passed/.test(what)?'✓ Safety check passed':/^checks failed/.test(what)?'Safety check failed':'✓ Saved';
  el.innerHTML=`<b>${head}</b><span>${esc(j.say||what)}</span>${ok?'':'<button class="btn" id="toastx">Close</button>'}`;
  el.style.cssText=base+`background:${ok&&!/^checks failed/.test(what)?'#0E7C66':'#9B1C1C'}`; clearTimeout(el._t); if(ok) el._t=setTimeout(()=>el.remove(),6000);
  const x=el.querySelector('#toastx'); if(x) x.onclick=()=>el.remove();
}
function openYaml(title,text){ document.getElementById('dt').textContent=title; document.getElementById('dy').textContent=text||'# not generated yet'; document.getElementById('drawer').hidden=false; document.getElementById('dclose').focus(); }
document.getElementById('dclose').onclick=()=>{document.getElementById('drawer').hidden=true;};
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('drawer').hidden=true; });
// ---------- render
function render(){
  R=parse(); nav(); const A=document.getElementById('app'), ns=R.ns, $=id=>A.querySelector('#'+id), on=(id,fn)=>{const b=$(id); if(b) b.onclick=fn;};
  if(R.v==='home'){ A.innerHTML=homeView(); } else
  A.innerHTML=R.v==='cluster'?clusterView():R.v==='namespaces'?namespacesView():R.v==='changes'?changesView():R.v==='workloads'?workloadsView():R.v==='policies'?policiesView():R.v==='activity'?activityView()
    :R.v==='workload'?workloadView(ns,R.w,R.tab):R.tab==='map'?nsMap(ns)
    :R.tab==='change'?planView(ns,nextOf(ns)?STAGE_OF_LEVEL[lvl(nextOf(ns))]:null):R.tab==='workloads'?nsWorkloads(ns):R.v==='home'?homeView():planView(ns,R.sel);
  A.querySelectorAll('tr[data-href]').forEach(r=>{ r.onclick=()=>go(r.dataset.href); r.tabIndex=0; r.onkeydown=e=>{ if(e.key==='Enter') go(r.dataset.href); }; });
  A.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{UI.filter=b.dataset.f; render();});
  const an=$('actns'); if(an) an.onchange=()=>go(`#/${R.v}${an.value?'/'+an.value:''}`);
  A.querySelectorAll('[data-swsearch]').forEach(inp=>inp.oninput=()=>{ const q=inp.value.toLowerCase(); inp.parentNode.querySelectorAll('[data-swname]').forEach(a=>{ a.style.display=a.dataset.swname.toLowerCase().includes(q)?'':'none'; }); });
  A.querySelectorAll('.nsw .menu a').forEach(a=>a.addEventListener('click',()=>{ UI.step=null; }));
  if(R.v==='cluster') drawCluster($('cmap'));
  if(R.v==='policies'){ const all=(UI.ans&&DATA[UI.ans]?[UI.ans]:NSS()).flatMap(policyRows); A.querySelectorAll('[data-pol]').forEach(b=>b.onclick=()=>{ const p=all[+b.dataset.pol]; openYaml(`${p.name} · in force`,p.yaml); }); }
  if(R.v==='workload'&&$('wmap')) drawMap($('wmap'),ns,{focus:R.w});
  A.querySelectorAll('[data-pexp]').forEach(b=>{ const t=()=>{ const k=b.dataset.pexp; UI.pexp[k]=!UI.pexp[k]; render(); }; b.onclick=t; b.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); t(); } }; });
  A.querySelectorAll('[data-pall]').forEach(b=>b.onclick=()=>{ const q=JSON.parse(b.dataset.pall); sendDecision(q.workload.split('/')[0],{kind:'programs',...q}); });
  A.querySelectorAll('[data-nq]').forEach(b=>b.onclick=()=>{ const q=JSON.parse(b.dataset.nq); sendDecision(R.ns||q.workload.split('/')[0],{kind:'answer',...q}); });
  if(LASTROUTE!==ROUTE){ LASTROUTE=ROUTE; if(!matchMedia('(prefers-reduced-motion: reduce)').matches){ A.classList.remove('enter'); void A.offsetWidth; A.classList.add('enter'); } }
  A.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{ const q=JSON.parse(b.dataset.pa); sendDecision(q.workload.split('/')[0],{kind:'program',...q}); });
  A.querySelectorAll('[data-plist]').forEach(d=>d.ontoggle=()=>{ UI.pexp[d.dataset.plist]=d.open; });
  if(R.v==='ns'){
    if(R.tab==='map'){ const ST=stepsOf(ns), i=UI.step, pick=k=>{UI.hl=UI.hl===k?null:k; render();};
      if($('m1')) drawMap($('m1'),ns,{step:ST[i-1],showBulk:UI.bulk,hl:UI.hl,onPick:pick}); drawMap($('m2'),ns,{step:ST[i],prev:i>0?ST[i-1]:null,showBulk:UI.bulk,hl:UI.hl,onPick:pick});
      A.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{UI.step=+b.dataset.step; UI.hl=null; render();}); const bk=$('bulk'); if(bk) bk.onchange=()=>{UI.bulk=bk.checked; render();}; const cm=$('cmp'); if(cm) cm.onchange=()=>{UI.compare=cm.checked; render();}; }
    { A.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.h.split(':').map(Number), s=stepsOf(ns)[i]; openYaml(`${(s.yaml[j].match(/name: (\S+)/)||[])[1]} · ${stepName(ns,i)} · ${s.now?"in force":"not in force"}`,s.yaml[j]); }); }
    const P=nextOf(ns);
    on('seemap',e=>{ e.preventDefault(); UI.step=P?stepsOf(ns).indexOf(P):null; UI.bulk=true; go(`#/ns/${ns}/map`); });
    on('yamlP',()=>openYaml(`${P?levelLabel(P):''} · ${P?fileBase(P.file):''}`,P?(P.yaml||[]).join('---\n'):''));
    on('approve',()=>{ if(P){ ASK={ns,kind:'approve',file:P.file,text:`Apply ${levelLabel(P)} to the cluster now?`}; render(); } });
    on('rollback',()=>{ const b=$('rollback'); const s=stepsOf(ns).filter(x=>!x.pending&&x.approved_by&&x.file).pop(); ASK={ns,kind:'rollback',file:b.dataset.f,text:`Roll back ${s?levelLabel(s):''}? The cluster goes back to the step before, now.`}; render(); });
    on('askyes',()=>{ const a=ASK; ASK=null; if(a) sendDecision(a.ns,{kind:a.kind,file:a.file}); });
    on('askno',()=>{ ASK=null; render(); });
    on('reject',()=>{ if(P) sendDecision(ns,{kind:'reject',file:P.file}); });
    on('runchecks',()=>{ if(P) sendDecision(ns,{kind:'check',file:P.file}); });
    const qs=questionsOf(ns); A.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const q=qs[+b.dataset.q]; sendDecision(ns,{kind:'answer',workload:q.w,to:q.to,port:q.port,needed:b.dataset.n==='1'}); });
  }
}
